// ============================================================
async function setTerrain(on, force = false) {
  if (!force && S.terrain === on) return;
  S.terrain = on;
  $('#btn-3d').classList.toggle('active', on);
  $$('#terrain-list .layer-toggle[data-t="3d"]').forEach(el => el.classList.toggle('on', on));
  if (on) {
    if (!S.map.getSource('terrain-dem')) {
      S.map.addSource('terrain-dem', {
        type: 'raster-dem',
        tiles: [CFG.terrainTiles],
        tileSize: 256, encoding: 'terrarium', maxzoom: 14,
      });
    }
    S.map.setTerrain({ source: 'terrain-dem', exaggeration: 1.5 });
    S.map.easeTo({ pitch: 55, duration: 800 });
  } else {
    S.map.setTerrain(null);
    S.map.easeTo({ pitch: 0, duration: 600 });
  }
  Store.saveSettings();
}

async function setHillshade(on, force = false) {
  if (!force && S.hillshade === on) return;
  S.hillshade = on;
  $$('#terrain-list .layer-toggle[data-t="hs"]').forEach(el => el.classList.toggle('on', on));
  if (on) {
    if (!S.map.getSource('terrain-dem')) {
      S.map.addSource('terrain-dem', {
        type: 'raster-dem',
        tiles: [CFG.terrainTiles],
        tileSize: 256, encoding: 'terrarium', maxzoom: 14,
      });
    }
    if (!S.map.getLayer('hillshade')) {
      S.map.addLayer({
        id: 'hillshade', type: 'hillshade', source: 'terrain-dem',
        paint: { 'hillshade-shadow-color': '#000', 'hillshade-highlight-color': '#fff', 'hillshade-exaggeration': 0.45 },
      }, firstSymbolLayerId());
    }
  } else {
    if (S.map.getLayer('hillshade')) S.map.removeLayer('hillshade');
  }
  Store.saveSettings();
}

function firstSymbolLayerId() {
  const layers = S.map.getStyle().layers;
  for (const l of layers) if (l.type === 'symbol') return l.id;
  return undefined;
}

function buildTerrainUI() {
  const list = $('#terrain-list');
  list.innerHTML = '';
  list.appendChild(makeToggle({ label: '3D terrain', sub: 'AWS Terrarium \u00b7 pitch 55\u00b0', color: '#4A9EFF', on: S.terrain, dataT: '3d', onChange: (v) => setTerrain(v) }));
  list.appendChild(makeToggle({ label: 'Hillshade', sub: 'shading from DEM', color: '#8b92a6', on: S.hillshade, dataT: 'hs', onChange: (v) => setHillshade(v) }));
}

function makeToggle({ label, sub, color, on, dataT, onChange }) {
  const el = document.createElement('div');
  el.className = 'layer-toggle' + (on ? ' on' : '');
  if (dataT) el.dataset.t = dataT;
  el.innerHTML = `
    <div class="layer-swatch" style="background:${color}"></div>
    <div class="layer-label">${label}<span class="sub">${sub}</span></div>
    <div class="switch"></div>
  `;
  el.onclick = () => { const newOn = !el.classList.contains('on'); onChange(newOn); };
  return el;
}

// ============================================================
// PUBLIC LANDS LAYERS
// ============================================================
// Z-order for the toggleable raster overlays. Earlier = drawn lower.
const LANDS_Z_ORDER = ['aspect', 'slope', 'snow', 'forests', 'blm', 'parks', 'wilderness', 'isochrone', 'trails'];

function landsInsertBeforeId(key) {
  const i = LANDS_Z_ORDER.indexOf(key);
  for (let j = i + 1; j < LANDS_Z_ORDER.length; j++) {
    const next = LANDS_Z_ORDER[j];
    if (!S.layers[next]) continue;
    const cands = [`lands-${next}`, `lands-${next}-fill`, `lands-${next}-iso-60-fill`];
    for (const id of cands) if (S.map.getLayer(id)) return id;
  }
  return firstTrackLayerId() || firstSymbolLayerId();
}

const _flBoundClicks = new Set();

function setLayer(key, on, force = false) {
  if (!force && S.layers[key] === on) return;
  S.layers[key] = on;
  const tog = document.querySelector(`.layer-toggle[data-key="${key}"]`);
  if (tog) tog.classList.toggle('on', on);

  const cfg = CFG.layers[key];
  const sourceId = `lands-${key}`;
  const layerId = `lands-${key}`;
  const fillId = `lands-${key}-fill`;
  const lineId = `lands-${key}-line`;

  if (on) {
    const kind = cfg.kind || 'arcgis-export';

    if (kind === 'isochrone') {
      addIsochroneLayer(key, cfg).catch(err => {
        console.warn('[isochrone] failed', err);
        toast(`Isochrone: ${err.message || 'load failed'}`, 'error', 5000);
        S.layers[key] = false;
        if (tog) tog.classList.remove('on');
      });
    } else if (kind === 'feature-query') {
      // Vector: empty source + fill/line layers + a moveend listener that
      // refetches when the viewport changes.
      if (!S.map.getSource(sourceId)) {
        S.map.addSource(sourceId, {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
          attribution: cfg.attribution || cfg.label,
        });
      }
      const beforeId = landsInsertBeforeId(key);
      if (!S.map.getLayer(fillId)) {
        S.map.addLayer({
          id: fillId, type: 'fill', source: sourceId,
          paint: { 'fill-color': cfg.color, 'fill-opacity': cfg.opacity },
        }, beforeId);
      }
      if (!S.map.getLayer(lineId)) {
        S.map.addLayer({
          id: lineId, type: 'line', source: sourceId,
          paint: { 'line-color': cfg.color, 'line-width': 1, 'line-opacity': 0.7 },
        }, beforeId);
      }
      fetchFederalLandsViewport();
      registerFederalLandsMoveEnd();
      // Click for info popup (name of the unit) — bound once per fillId to
      // prevent stacking N handlers when the layer is toggled off/on N times.
      if (!_flBoundClicks.has(fillId)) {
        S.map.on('click', fillId, federalLandClick);
        S.map.on('mouseenter', fillId, () => S.map.getCanvas().style.cursor = 'pointer');
        S.map.on('mouseleave', fillId, () => S.map.getCanvas().style.cursor = '');
        _flBoundClicks.add(fillId);
      }
    } else {
      // Raster path — three sub-kinds, one source, one layer.
      if (!S.map.getSource(sourceId)) {
        let tileUrl, tileSize, attribution;

        if (kind === 'arcgis-export') {
          tileUrl = `${cfg.url}/export?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=512,512&format=png32&transparent=true&dpi=96&layers=${cfg.layers}&f=image`;
          if (cfg.layerDefs) tileUrl += `&layerDefs=${encodeURIComponent(JSON.stringify(cfg.layerDefs))}`;
          tileSize = 512;
          attribution = cfg.attribution || (cfg.label + ' (public ArcGIS service)');
        } else if (kind === 'arcgis-image') {
          tileUrl = `${cfg.url}/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=512,512&format=png32&interpolation=RSP_BilinearInterpolation&transparent=true&f=image`;
          if (cfg.renderingRule) tileUrl += `&renderingRule=${encodeURIComponent(JSON.stringify(cfg.renderingRule))}`;
          tileSize = 512;
          attribution = cfg.attribution || (cfg.label + ' (public ArcGIS image service)');
        } else if (kind === 'xyz') {
          tileUrl = cfg.url;
          tileSize = cfg.tileSize || 256;
          attribution = cfg.attribution || cfg.label;
        }

        S.map.addSource(sourceId, {
          type: 'raster',
          tiles: [tileUrl],
          tileSize,
          attribution,
          ...(cfg.maxzoom != null ? { maxzoom: cfg.maxzoom } : {}),
        });
      }
      if (!S.map.getLayer(layerId)) {
        const beforeId = landsInsertBeforeId(key);
        S.map.addLayer({
          id: layerId, type: 'raster', source: sourceId,
          paint: { 'raster-opacity': cfg.opacity },
        }, beforeId);
      }
    }
  } else {
    if (cfg && cfg.kind === 'isochrone') {
      removeIsochroneLayer(key);
    } else {
      for (const id of [layerId, fillId, lineId]) {
        if (S.map.getLayer(id)) S.map.removeLayer(id);
      }
      if (S.map.getSource(sourceId)) S.map.removeSource(sourceId);
    }
    const anyVectorOn = Object.entries(CFG.layers).some(([k, c]) =>
      c.kind === 'feature-query' && S.layers[k]);
    if (!anyVectorOn) unregisterFederalLandsMoveEnd();
  }
  updateLegend();
  Store.saveSettings();
}

// ============================================================
// ISOCHRONE LAYER — drive-time rings from CFG.driveOrigin
// ============================================================
// Source: Valhalla FOSSGIS public demo (free, no key, CORS-enabled).
// Fair-use only — we cache in localStorage keyed by origin so we don't
// re-hit the server unless the origin moves. 30-day TTL is plenty since
// the road graph barely changes the shape of a multi-hour ring.
const ISO_CACHE_KEY = 'bcm.isochrone.v1';
const ISO_CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000;
const _isoBoundClicks = new Set();

function isoCacheKey(o) { return `${o.lat.toFixed(4)},${o.lng.toFixed(4)}`; }

function loadIsoCache(origin) {
  try {
    const all = JSON.parse(localStorage.getItem(ISO_CACHE_KEY) || '{}');
    const entry = all[isoCacheKey(origin)];
    if (!entry || Date.now() - entry.ts > ISO_CACHE_TTL_MS) return null;
    return entry.data;
  } catch (e) { return null; }
}

function saveIsoCache(origin, data) {
  try {
    const all = JSON.parse(localStorage.getItem(ISO_CACHE_KEY) || '{}');
    all[isoCacheKey(origin)] = { ts: Date.now(), data };
    localStorage.setItem(ISO_CACHE_KEY, JSON.stringify(all));
  } catch (e) {}
}

async function fetchIsochrones(origin, contours) {
  const body = {
    locations: [{ lat: origin.lat, lon: origin.lng }],
    costing: 'auto',
    contours: contours.map(t => ({ time: t })),
    polygons: true,
    denoise: 0.5,
    generalize: 200,
    id: 'bcm-iso',
    show_locations: false,
  };
  const url = 'https://valhalla1.openstreetmap.de/isochrone?json=' + encodeURIComponent(JSON.stringify(body));
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  if (!data || !data.features) throw new Error('no isochrone returned');
  return data;
}

async function addIsochroneLayer(key, cfg) {
  const origin = CFG.driveOrigin;
  let data = loadIsoCache(origin);
  if (!data) {
    toast(`Loading drive-time rings from ${origin.label}\u2026`, 'info', 4000);
    data = await fetchIsochrones(origin, cfg.contours);
    saveIsoCache(origin, data);
  }
  // Paint biggest ring first so smaller rings layer on top — otherwise
  // the inner rings get hidden by the outer polygons.
  // NOTE: Valhalla may return contour values as strings ("60") or numbers.
  // Normalise to Number for sorting and indexOf comparisons.
  const features = (data.features || []).slice().sort((a, b) => {
    const ta = Number(a.properties?.contour ?? a.properties?.value ?? 0);
    const tb = Number(b.properties?.contour ?? b.properties?.value ?? 0);
    return tb - ta;  // descending: largest ring first in layer stack
  });
  for (let i = 0; i < features.length; i++) {
    const f = features[i];
    // Coerce to Number — Valhalla FOSSGIS returns string contour values
    const raw = f.properties?.contour ?? f.properties?.value;
    // fallback: after descending sort, index 0 = largest contour
    const minutes = raw != null ? Number(raw) : cfg.contours[cfg.contours.length - 1 - i];
    const idx = cfg.contours.indexOf(minutes);
    const color = cfg.contourColors[idx >= 0 ? idx : (cfg.contours.length - 1 - i)] || cfg.color;
    const srcId = `lands-${key}-iso-${minutes}`;
    const fillId = `${srcId}-fill`;
    const lineId = `${srcId}-line`;
    if (!S.map.getSource(srcId)) {
      S.map.addSource(srcId, {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [{ ...f, properties: { ...f.properties, _minutes: minutes } }] },
        attribution: cfg.attribution || cfg.label,
      });
    }
    const beforeId = landsInsertBeforeId(key);
    if (!S.map.getLayer(fillId)) {
      S.map.addLayer({ id: fillId, type: 'fill', source: srcId,
        paint: { 'fill-color': color, 'fill-opacity': cfg.opacity } }, beforeId);
    }
    if (!S.map.getLayer(lineId)) {
      S.map.addLayer({ id: lineId, type: 'line', source: srcId,
        paint: { 'line-color': color, 'line-width': 1.5, 'line-opacity': 0.7 } }, beforeId);
    }
    if (!_isoBoundClicks.has(fillId)) {
      S.map.on('click', fillId, (e) => {
        const m = e.features[0]?.properties?._minutes ?? minutes;
        const h = Math.floor(m / 60), mins = m % 60;
        const label = h > 0 ? `${h}h ${mins ? mins + 'min' : ''}`.trim() : `${mins} min`;
        new maplibregl.Popup({ offset: 8, maxWidth: '220px' })
          .setLngLat(e.lngLat)
          .setHTML(`<div style="font-weight:600;font-size:13px;color:${color}">Within ${label}</div>
            <div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim)">driving from ${escapeHtml(origin.label)}</div>`)
          .addTo(S.map);
      });
      S.map.on('mouseenter', fillId, () => S.map.getCanvas().style.cursor = 'pointer');
      S.map.on('mouseleave', fillId, () => S.map.getCanvas().style.cursor = '');
      _isoBoundClicks.add(fillId);
    }
  }
}

function removeIsochroneLayer(key) {
  const cfg = CFG.layers[key];
  if (!cfg?.contours) return;
  for (const m of cfg.contours) {
    const srcId = `lands-${key}-iso-${m}`;
    const fillId = `${srcId}-fill`, lineId = `${srcId}-line`;
    if (S.map.getLayer(fillId)) S.map.removeLayer(fillId);
    if (S.map.getLayer(lineId)) S.map.removeLayer(lineId);
    if (S.map.getSource(srcId)) S.map.removeSource(srcId);
    _isoBoundClicks.delete(fillId);
  }
}

// ============================================================
// Federal lands — vector viewport queries
// ============================================================
const _flMoveEnd = { fn: null };
const _flAbort = new Map();
const _flLastKey = new Map();

function viewportKey() {
  const b = S.map.getBounds();
  return `${b.getWest().toFixed(3)},${b.getSouth().toFixed(3)},${b.getEast().toFixed(3)},${b.getNorth().toFixed(3)}`;
}

async function fetchFederalLandsViewport() {
  if (S.map.getZoom() < 5) return;
  const k = viewportKey();
  const wanted = Object.entries(CFG.layers)
    .filter(([k, c]) => c.kind === 'feature-query' && S.layers[k]);
  for (const [key, cfg] of wanted) {
    if (_flLastKey.get(key) === k) continue;
    _flLastKey.set(key, k);
    fetchOneLayer(key, cfg).catch(err => {
      if (err.name !== 'AbortError') console.warn(`[${key}] fetch failed`, err);
    });
  }
}

async function fetchOneLayer(key, cfg) {
  const prev = _flAbort.get(key);
  if (prev) prev.abort();
  const ctl = new AbortController();
  _flAbort.set(key, ctl);

  const b = S.map.getBounds();
  const params = new URLSearchParams({
    geometry: `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`,
    geometryType: 'esriGeometryEnvelope',
    inSR: '4326',
    // outSR omitted: GeoJSON output is always WGS84; some Esri endpoints
    // reject outSR when combined with f=geojson.
    spatialRel: 'esriSpatialRelIntersects',
    outFields: cfg.outFields || '*',
    returnGeometry: 'true',
    f: 'geojson',
    resultRecordCount: '1000',
    geometryPrecision: '5',
  });
  if (cfg.whereField && cfg.whereValue) {
    params.set('where', `${cfg.whereField} = '${cfg.whereValue.replace(/'/g, "''")}'`);
  } else {
    params.set('where', '1=1');
  }

  const r = await fetch(`${cfg.featureUrl}?${params}`, { signal: ctl.signal });
  if (!r.ok) {
    const msg = `${cfg.label}: HTTP ${r.status} — service may require authentication`;
    toast(msg, 'error', 6000);
    console.error('[lands]', key, msg);
    return;
  }
  const data = await r.json();
  if (data && data.error) {
    const msg = `${cfg.label}: ${data.error.message || 'service error'} (code ${data.error.code || '?'})`;
    toast(msg, 'error', 6000);
    console.error('[lands]', key, data.error);
    return;
  }
  const features = (data && data.features) || [];
  console.debug(`[lands] ${key}: ${features.length} features`);
  const src = S.map.getSource(`lands-${key}`);
  if (src) src.setData({ type: 'FeatureCollection', features });
}

function registerFederalLandsMoveEnd() {
  if (_flMoveEnd.fn) return;
  _flMoveEnd.fn = () => fetchFederalLandsViewport();
  S.map.on('moveend', _flMoveEnd.fn);
}
function unregisterFederalLandsMoveEnd() {
  if (!_flMoveEnd.fn) return;
  S.map.off('moveend', _flMoveEnd.fn);
  _flMoveEnd.fn = null;
  _flLastKey.clear();
}

function federalLandClick(e) {
  const f = e.features[0];
  const p = f.properties || {};
  const layerId = e.features[0].layer.id;
  const key = layerId.replace('lands-', '').replace('-fill', '');
  const cfg = CFG.layers[key];
  const name = (cfg && cfg.nameField && p[cfg.nameField]) || p.unit_name || p.UNIT_NAME || p.name1 || 'Federal land';
  const subtext = (cfg && cfg.agencyField && p[cfg.agencyField]) || cfg?.label || '';
  new maplibregl.Popup({ offset: 8, className: 'wpt-popup-wrap', maxWidth: '260px' })
    .setLngLat(e.lngLat)
    .setHTML(`<div class="fed-popup">
      <div class="fed-popup-name">${escapeHtml(String(name))}</div>
      <div class="fed-popup-agency">${escapeHtml(String(subtext))}</div>
    </div>`)
    .addTo(S.map);
}

function firstTrackLayerId() {
  for (const [, t] of S.tracks) if (t.layerIds?.length) return t.layerIds[0];
  return null;
}

function buildLayersUI() {
  const list = $('#layers-list');
  list.innerHTML = '';
  for (const [k, v] of Object.entries(CFG.layers)) {
    let sub = v.sub;
    if (!sub) {
      if (v.kind === 'feature-query') sub = 'Esri Living Atlas';
      else if (k === 'wilderness') sub = 'USFS Wilderness';
      else sub = '';
    }
    const el = makeToggle({ label: v.label, sub, color: v.color, on: S.layers[k], onChange: (on) => setLayer(k, on) });
    el.dataset.key = k;
    list.appendChild(el);
  }
}

function updateLegend() {
  const active = Object.entries(S.layers).filter(([_, v]) => v);
  const legend = $('#legend');
  if (!active.length) { legend.classList.remove('show'); return; }
  legend.classList.add('show');
  $('#legend-items').innerHTML = active.map(([k]) => {
    const c = CFG.layers[k];
    if (k === 'slope') {
      return `<div class="legend-item">
        <div class="legend-swatch slope-swatch" title="0\u00b0 gray \u2192 45\u00b0+ red-brown"></div>
        ${c.label}<span class="legend-sub"> 0\u201360\u00b0</span>
      </div>`;
    }
    if (k === 'aspect') {
      return `<div class="legend-item">
        <div class="legend-swatch aspect-swatch" title="N=red, E=yellow, S=cyan, W=purple"></div>
        ${c.label}<span class="legend-sub"> N\u2192S\u2192W</span>
      </div>`;
    }
    if (k === 'snow') {
      return `<div class="legend-item">
        <div class="legend-swatch snow-swatch" title="white = no snow \u2192 deep blue = 100+ in"></div>
        ${c.label}<span class="legend-sub"> in</span>
      </div>`;
    }
    if (k === 'isochrone') {
      return `<div class="legend-item">
        <div class="legend-swatch" style="width:28px;height:14px;background:linear-gradient(to right,#6BCB77 0%,#FFD93D 33%,#FF9F5A 66%,#FF6B35 100%);opacity:0.85"></div>
        ${c.label}<span class="legend-sub"> 1\u00b72\u00b73\u00b74 hr</span>
      </div>`;
    }
    return `<div class="legend-item"><div class="legend-swatch" style="background:${c.color};opacity:${c.opacity + 0.2}"></div>${c.label}</div>`;
  }).join('');
}

// ============================================================
// PIN DROP TOOL
// ============================================================
const PIN_SOURCE = 'user-pins';
const PIN_LAYER = 'user-pins-circle';
const PIN_LABEL_LAYER = 'user-pins-label';

function ensurePinLayers() {
  if (S.map.getSource(PIN_SOURCE)) return;
  S.map.addSource(PIN_SOURCE, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  S.map.addLayer({
    id: PIN_LAYER, type: 'circle', source: PIN_SOURCE,
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 4, 14, 8, 18, 10],
      'circle-color': '#FFD93D',
      'circle-stroke-color': '#1a1d27',
      'circle-stroke-width': 2.5,
      'circle-opacity': 0.95,
    },
  });
  S.map.addLayer({
    id: PIN_LABEL_LAYER, type: 'symbol', source: PIN_SOURCE, minzoom: 10,
    layout: {
      'text-field': ['coalesce', ['get', 'name'], ''],
      'text-font': ['Noto Sans Regular', 'Open Sans Regular', 'Arial Unicode MS Regular'],
      'text-size': 12, 'text-offset': [0, 1.0], 'text-anchor': 'top',
      'text-allow-overlap': false, 'text-optional': true, 'text-max-width': 10,
    },
    paint: { 'text-color': '#FFD93D', 'text-halo-color': 'rgba(0,0,0,0.85)', 'text-halo-width': 1.6 },
  });
  S.map.on('click', PIN_LAYER, (e) => {
    e.preventDefault?.();
    const f = e.features[0];
    const id = f.properties.id;
    const pin = S.pins.find(p => p.id === id);
    if (!pin) return;
    const html = `
      <div class="pin-popup">
        <div class="pin-popup-name">${escapeHtml(pin.name || 'Pin')}</div>
        <div class="pin-popup-coords">${pin.lat.toFixed(5)}, ${pin.lng.toFixed(5)}</div>
        <div class="pin-popup-meta">${new Date(pin.ts).toLocaleString()}</div>
        <button class="pin-popup-delete" data-pin-id="${pin.id}">Remove pin</button>
      </div>`;
    const popup = new maplibregl.Popup({ offset: 14, className: 'pin-popup-wrap', maxWidth: '240px' })
      .setLngLat([pin.lng, pin.lat]).setHTML(html).addTo(S.map);
    setTimeout(() => {
      const btn = document.querySelector(`.pin-popup-delete[data-pin-id="${pin.id}"]`);
      if (btn) btn.onclick = () => { removePin(pin.id); popup.remove(); };
    }, 0);
  });
  S.map.on('mouseenter', PIN_LAYER, () => S.map.getCanvas().style.cursor = 'pointer');
  S.map.on('mouseleave', PIN_LAYER, () => S.map.getCanvas().style.cursor = S.pinMode ? 'crosshair' : '');
}

function refreshPinLayer() {
  if (!S.map.getSource(PIN_SOURCE)) return;
  S.map.getSource(PIN_SOURCE).setData({
    type: 'FeatureCollection',
    features: S.pins.map(p => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [p.lng, p.lat] },
      properties: { id: p.id, name: p.name },
    })),
  });
}

function setPinMode(on) {
  S.pinMode = on;
  const btn = $('#btn-pin');
  if (btn) btn.classList.toggle('active', on);
  S.map.getCanvas().style.cursor = on ? 'crosshair' : '';
  document.body.classList.toggle('pin-mode', on);
}

function dropPin(lngLat) {
  const name = (window.prompt('Pin name:', '') || '').trim();
  if (name === null) return;
  const pin = { id: 'pin-' + uid(), lng: lngLat.lng, lat: lngLat.lat, name: name || 'Pin', ts: Date.now() };
  S.pins.push(pin);
  Store.savePins();
  refreshPinLayer();
}

function removePin(id) {
  S.pins = S.pins.filter(p => p.id !== id);
  Store.savePins();
  refreshPinLayer();
}

function clearAllPins() {
  if (!S.pins.length) return;
  if (!confirm(`Remove all ${S.pins.length} pins?`)) return;
  S.pins = [];
  Store.savePins();
  refreshPinLayer();
}

// ============================================================
// MEASUREMENT TOOL
// ============================================================
const MEASURE_SOURCE = 'measure';
const MEASURE_LINE = 'measure-line';
const MEASURE_POINTS = 'measure-points';
const MEASURE_LABEL = 'measure-label';

S.measure = { active: false, points: [] };

function ensureMeasureLayers() {
  if (S.map.getSource(MEASURE_SOURCE)) return;
  S.map.addSource(MEASURE_SOURCE, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  S.map.addLayer({
    id: MEASURE_LINE, type: 'line', source: MEASURE_SOURCE,
    filter: ['==', ['geometry-type'], 'LineString'],
    paint: { 'line-color': '#FFD93D', 'line-width': 2.5, 'line-dasharray': [2, 1.5] },
    layout: { 'line-cap': 'round', 'line-join': 'round' },
  });
  S.map.addLayer({
    id: MEASURE_POINTS, type: 'circle', source: MEASURE_SOURCE,
    filter: ['==', ['geometry-type'], 'Point'],
    paint: { 'circle-radius': 5, 'circle-color': '#FFD93D', 'circle-stroke-color': '#1a1d27', 'circle-stroke-width': 2 },
  });
  S.map.addLayer({
    id: MEASURE_LABEL, type: 'symbol', source: MEASURE_SOURCE,
    filter: ['==', ['geometry-type'], 'Point'],
    layout: {
      'text-field': ['coalesce', ['get', 'label'], ''],
      'text-font': ['Noto Sans Regular', 'Open Sans Regular', 'Arial Unicode MS Regular'],
      'text-size': 11, 'text-offset': [0, -1.4], 'text-anchor': 'bottom', 'text-allow-overlap': true,
    },
    paint: { 'text-color': '#FFD93D', 'text-halo-color': 'rgba(0,0,0,0.85)', 'text-halo-width': 1.5 },
  });
}

function refreshMeasureLayer() {
  if (!S.map.getSource(MEASURE_SOURCE)) return;
  const features = [];
  const pts = S.measure.points;
  let cum = 0;
  for (let i = 0; i < pts.length; i++) {
    if (i > 0) cum += haversine(pts[i - 1], pts[i]);
    features.push({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: pts[i] },
      properties: { label: i === 0 ? 'start' : `${cum.toFixed(2)} mi` },
    });
  }
  if (pts.length >= 2) {
    features.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: pts }, properties: {} });
  }
  S.map.getSource(MEASURE_SOURCE).setData({ type: 'FeatureCollection', features });
}

function setMeasureMode(on) {
  S.measure.active = on;
  const btn = $('#btn-measure');
  if (btn) btn.classList.toggle('active', on);
  document.body.classList.toggle('measure-mode', on);
  ensureMeasureLayers();
  if (!on && S.measure.points.length === 0) {
    const r = $('#measure-readout');
    if (r) r.classList.remove('show');
  }
}

function clearMeasure() {
  S.measure.points = [];
  refreshMeasureLayer();
  const r = $('#measure-readout');
  if (r) r.classList.remove('show');
}

function addMeasurePoint(lngLat) {
  S.measure.points.push([lngLat.lng, lngLat.lat]);
  refreshMeasureLayer();
  updateMeasureReadout();
}

function updateMeasureReadout() {
  const r = $('#measure-readout');
  if (!r) return;
  const pts = S.measure.points;
  if (pts.length < 1) { r.classList.remove('show'); return; }
  let total = 0;
  for (let i = 1; i < pts.length; i++) total += haversine(pts[i - 1], pts[i]);
  let bearing = '';
  if (pts.length >= 2) {
    const a = pts[pts.length - 2], b = pts[pts.length - 1];
    const dy = b[1] - a[1], dx = b[0] - a[0];
    const bd = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
    bearing = ` \u00b7 ${bd.toFixed(0)}\u00b0`;
  }
  r.classList.add('show');
  r.innerHTML = pts.length === 1
    ? `<span class="m-label">measure</span> <span class="m-val">click to add points \u00b7 double-click to finish</span>`
    : `<span class="m-label">distance</span> <span class="m-val">${total.toFixed(2)} mi${bearing}</span> <span class="m-pts">(${pts.length} pts)</span> <button id="btn-measure-clear">\u00d7</button>`;
  const clear = $('#btn-measure-clear');
  if (clear) clear.onclick = clearMeasure;
}

// ============================================================
// GPX LOADING
// ============================================================
async function loadGPXFile(file) {
  const text = await file.text();
  return loadGPXText(text, file.name.replace(/\.gpx$/i, ''), file.name);
}

async function loadGPXFromURL(url, displayName, options = {}) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    return loadGPXText(text, displayName || url.split('/').pop().replace(/\.gpx$/i, ''), url, options);
  } catch (e) {
    toast(`Failed to load ${displayName || url}: ${e.message}`, 'error');
    return null;
  }
}

function loadGPXText(text, defaultName, source, options = {}) {
  let dom;
  try {
    dom = new DOMParser().parseFromString(text, 'application/xml');
    if (dom.querySelector('parsererror')) throw new Error('Invalid XML');
  } catch (e) {
    toast('Could not parse GPX: ' + e.message, 'error');
    return null;
  }
  const fc = gpx(dom);
  if (!fc.features || !fc.features.length) {
    toast('No tracks or routes found in GPX', 'error');
    return null;
  }

  const fileBase = defaultName || 'gpx';
  const lineFeatures = [];
  const wptFeatures = [];
  for (const f of fc.features) {
    if (f.geometry.type === 'LineString' || f.geometry.type === 'MultiLineString') lineFeatures.push(f);
    else if (f.geometry.type === 'Point' || f.geometry.type === 'MultiPoint') wptFeatures.push(f);
  }
  for (const f of wptFeatures) {
    f.properties = f.properties || {};
    f.properties._kind = classifyWaypoint(f.properties);
  }

  if (options.grouped) {
    const allCoords = [];
    let totalDist = 0, totalGain = 0, totalLoss = 0;
    let maxEle = 0, minEle = Infinity;
    let wptCount = 0;
    for (const f of lineFeatures) {
      const coords = [];
      if (f.geometry.type === 'LineString') {
        for (const c of f.geometry.coordinates) { coords.push(c); allCoords.push(c); }
      } else {
        for (const line of f.geometry.coordinates) for (const c of line) { coords.push(c); allCoords.push(c); }
      }
      const s = calcStats(coords);
      totalDist += s.distance; totalGain += s.gain; totalLoss += s.loss;
      if (s.maxEle > maxEle) maxEle = s.maxEle;
      if (s.minEle && s.minEle < minEle) minEle = s.minEle;
      f.properties = f.properties || {};
      f.properties._stats = s;
    }
    for (const f of wptFeatures) {
      wptCount += f.geometry.type === 'MultiPoint' ? f.geometry.coordinates.length : 1;
    }
    const t = {
      id: 'trk-' + uid(), name: fileBase, color: nextTrackColor(), geojson: fc,
      stats: { distance: totalDist, gain: totalGain, loss: totalLoss,
        maxEle, minEle: minEle === Infinity ? 0 : minEle, wptCount, lineCount: lineFeatures.length },
      source, allCoords, grouped: true, featureCount: lineFeatures.length + wptCount,
    };
    S.tracks.set(t.id, t);
    renderTrackOnMap(t);
    buildTracksUI();
    Store.saveTracks();
    fitTrack(t);
    return t;
  }

  if (options.groupByGeomType) {
    const polyFeatures = [], reclassifiedLines = [], reclassifiedWpts = [];
    for (const f of fc.features) {
      const gt = f.geometry.type;
      if (gt === 'LineString' || gt === 'MultiLineString') reclassifiedLines.push(f);
      else if (gt === 'Point' || gt === 'MultiPoint') reclassifiedWpts.push(f);
      else if (gt === 'Polygon' || gt === 'MultiPolygon') polyFeatures.push(f);
    }
    let totalDist = 0, totalGain = 0, totalLoss = 0, maxEle = 0;
    const allLineCoords = [];
    for (const f of reclassifiedLines) {
      const coords = [];
      if (f.geometry.type === 'LineString') for (const c of f.geometry.coordinates) { coords.push(c); allLineCoords.push(c); }
      else for (const line of f.geometry.coordinates) for (const c of line) { coords.push(c); allLineCoords.push(c); }
      const s = calcStats(coords);
      totalDist += s.distance; totalGain += s.gain; totalLoss += s.loss;
      if (s.maxEle > maxEle) maxEle = s.maxEle;
      f.properties = f.properties || {};
      f.properties._stats = s;
    }
    const created = [];
    if (reclassifiedLines.length) {
      const t = {
        id: 'trk-' + uid(), name: `${fileBase} \u2014 Lines`, color: nextTrackColor(),
        geojson: { type: 'FeatureCollection', features: reclassifiedLines },
        stats: { distance: totalDist, gain: totalGain, loss: totalLoss, maxEle, minEle: 0, wptCount: 0, lineCount: reclassifiedLines.length },
        source, allCoords: allLineCoords, grouped: true, groupByGeomKind: 'lines',
      };
      S.tracks.set(t.id, t); renderTrackOnMap(t); created.push(t);
    }
    if (reclassifiedWpts.length) {
      let wptCount = 0;
      for (const f of reclassifiedWpts) {
        f.properties = f.properties || {};
        f.properties._kind = classifyWaypoint(f.properties);
        wptCount += f.geometry.type === 'MultiPoint' ? f.geometry.coordinates.length : 1;
      }
      const t = {
        id: 'trk-' + uid(), name: `${fileBase} \u2014 Points`, color: '#FFD93D',
        geojson: { type: 'FeatureCollection', features: reclassifiedWpts },
        stats: { distance: 0, gain: 0, loss: 0, maxEle: 0, minEle: 0, wptCount, lineCount: 0 },
        source, allCoords: [], grouped: true, groupByGeomKind: 'points', isWaypointGroup: true,
      };
      S.tracks.set(t.id, t); renderTrackOnMap(t); created.push(t);
    }
    if (polyFeatures.length) {
      const t = {
        id: 'trk-' + uid(), name: `${fileBase} \u2014 Polygons`, color: '#9F7AEA',
        geojson: { type: 'FeatureCollection', features: polyFeatures },
        stats: { distance: 0, gain: 0, loss: 0, maxEle: 0, minEle: 0, wptCount: 0, lineCount: 0 },
        source, allCoords: [], grouped: true, groupByGeomKind: 'polygons',
      };
      S.tracks.set(t.id, t); renderTrackOnMap(t); created.push(t);
    }
    buildTracksUI(); Store.saveTracks();
    if (created.length) { fitTracks(created); created[0].siblings = created; }
    return created[0] || null;
  }

  // ----- SPLIT MODE (default) -----
  const created = [];
  for (let i = 0; i < lineFeatures.length; i++) {
    const f = lineFeatures[i];
    const featName = (f.properties && f.properties.name)
      || (lineFeatures.length === 1 ? fileBase : `${fileBase} #${i + 1}`);
    const allCoords = [];
    if (f.geometry.type === 'LineString') for (const c of f.geometry.coordinates) allCoords.push(c);
    else for (const line of f.geometry.coordinates) for (const c of line) allCoords.push(c);
    const stats = calcStats(allCoords);
    stats.wptCount = 0; stats.lineCount = 1;
    const t = {
      id: 'trk-' + uid(), name: featName, color: nextTrackColor(),
      geojson: { type: 'FeatureCollection', features: [f] },
      stats, source, allCoords, groupSource: source,
    };
    S.tracks.set(t.id, t); renderTrackOnMap(t); created.push(t);
  }
  if (wptFeatures.length) {
    let wptCount = 0;
    for (const f of wptFeatures) wptCount += f.geometry.type === 'MultiPoint' ? f.geometry.coordinates.length : 1;
    const wptName = lineFeatures.length === 0 ? fileBase : `${fileBase} \u2014 waypoints`;
    const stats = { distance: 0, gain: 0, loss: 0, maxEle: 0, minEle: 0, wptCount, lineCount: 0 };
    const t = {
      id: 'trk-' + uid(), name: wptName, color: '#FFD93D',
      geojson: { type: 'FeatureCollection', features: wptFeatures },
      stats, source, allCoords: [], groupSource: source, isWaypointGroup: true,
    };
    S.tracks.set(t.id, t); renderTrackOnMap(t); created.push(t);
  }
  buildTracksUI(); Store.saveTracks();
  if (created.length) { fitTracks(created); created[0].siblings = created; }
  return created[0] || null;
}

function fitTracks(tracks) {
  let minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
  let any = false;
  const visit = (c) => {
    any = true;
    if (c[0] < minLng) minLng = c[0]; if (c[0] > maxLng) maxLng = c[0];
    if (c[1] < minLat) minLat = c[1]; if (c[1] > maxLat) maxLat = c[1];
  };
  for (const t of tracks) {
    for (const c of t.allCoords) visit(c);
    for (const f of t.geojson.features) {
      if (f.geometry.type === 'Point') visit(f.geometry.coordinates);
      else if (f.geometry.type === 'MultiPoint') for (const c of f.geometry.coordinates) visit(c);
    }
  }
  if (!any) return;
  if (Math.abs(maxLng - minLng) < 0.001 && Math.abs(maxLat - minLat) < 0.001) {
    const pad = 0.01;
    minLng -= pad; maxLng += pad; minLat -= pad; maxLat += pad;
  }
  S.map.fitBounds([[minLng, minLat], [maxLng, maxLat]], { padding: 80, duration: 900, maxZoom: 14 });
}

function classifyWaypoint(props) {
  const s = ((props.sym || '') + ' ' + (props.type || '') + ' ' + (props.name || '')).toLowerCase();
  if (/\b(camp|tent|bivvy|bivouac|shelter|hut|lodge|cabin)\b/.test(s)) return 'camp';
  if (/\b(summit|peak|mountain|pass|saddle|highpoint|13er|14er)\b/.test(s)) return 'peak';
  if (/\b(water|spring|stream|creek|river|lake|pond|tarn|reservoir|well)\b/.test(s)) return 'water';
  if (/\b(trail.?head|parking|trailhead|car ?park)\b/.test(s)) return 'trailhead';
  if (/\b(photo|view|vista|scenic|overlook|lookout)\b/.test(s)) return 'view';
  if (/\b(danger|warning|hazard|cliff|crevasse|slide)\b/.test(s)) return 'hazard';
  if (/\b(food|restaurant|store|resupply)\b/.test(s)) return 'food';
  return 'generic';
}

function renderTrackOnMap(track) {
  const sourceId = `track-${track.id}`;
  const glowId = `${sourceId}-glow`;
  const lineId = `${sourceId}-line`;
  const startId = `${sourceId}-start`;
  const endId = `${sourceId}-end`;
  const wptId = `${sourceId}-wpt`;
  const wptLabelId = `${sourceId}-wpt-label`;

  for (const id of [glowId, lineId, startId, endId, wptId, wptLabelId])
    if (S.map.getLayer(id)) S.map.removeLayer(id);
  if (S.map.getSource(sourceId)) S.map.removeSource(sourceId);
  if (S.map.getSource(sourceId + '-wpt-src')) S.map.removeSource(sourceId + '-wpt-src');
  if (S.map.getSource(sourceId + '-pins')) S.map.removeSource(sourceId + '-pins');

  S.map.addSource(sourceId, { type: 'geojson', data: track.geojson, lineMetrics: true });

  const lineW = track.lineWidth || 3;
  const op = track.opacity ?? 0.95;
  S.map.addLayer({
    id: glowId, type: 'line', source: sourceId,
    filter: ['in', ['geometry-type'], ['literal', ['LineString', 'MultiLineString']]],
    paint: { 'line-color': track.color, 'line-width': lineW * 3, 'line-opacity': op * 0.26, 'line-blur': 4 },
    layout: { 'line-cap': 'round', 'line-join': 'round', visibility: track.visible === false ? 'none' : 'visible' },
  });
  S.map.addLayer({
    id: lineId, type: 'line', source: sourceId,
    filter: ['in', ['geometry-type'], ['literal', ['LineString', 'MultiLineString']]],
    paint: { 'line-color': track.color, 'line-width': lineW, 'line-opacity': op },
    layout: { 'line-cap': 'round', 'line-join': 'round', visibility: track.visible === false ? 'none' : 'visible' },
  });

  const wptFeatures = [];
  for (const f of track.geojson.features) {
    if (f.geometry.type === 'Point') {
      wptFeatures.push(f);
    } else if (f.geometry.type === 'MultiPoint') {
      for (const c of f.geometry.coordinates) {
        wptFeatures.push({ type: 'Feature', geometry: { type: 'Point', coordinates: c }, properties: { ...(f.properties || {}) } });
      }
    }
  }
  if (wptFeatures.length) {
    const wptSrcId = sourceId + '-wpt-src';
    S.map.addSource(wptSrcId, { type: 'geojson', data: { type: 'FeatureCollection', features: wptFeatures } });
    const colorByKind = ['match', ['coalesce', ['get', '_kind'], 'generic'],
      'camp', '#FF6B35', 'peak', '#4A9EFF', 'water', '#3DC9F5', 'trailhead', '#FFD700',
      'view', '#A78BFA', 'food', '#F5A623', 'hazard', '#FF3B30', track.color];
    const radiusByZoom = ['interpolate', ['linear'], ['zoom'], 6, 2.5, 10, 4.5, 14, 6.5, 18, 8];
    S.map.addLayer({
      id: wptId, type: 'circle', source: wptSrcId,
      layout: { visibility: track.visible === false ? 'none' : 'visible' },
      paint: { 'circle-radius': radiusByZoom, 'circle-color': colorByKind,
        'circle-stroke-color': '#ffffff', 'circle-stroke-width': 1.5,
        'circle-stroke-opacity': 0.95, 'circle-opacity': 0.95 },
    });
    S.map.addLayer({
      id: wptLabelId, type: 'symbol', source: wptSrcId, minzoom: 11,
      layout: {
        'text-field': ['coalesce', ['get', 'name'], ''],
        'text-font': ['Noto Sans Regular', 'Open Sans Regular', 'Arial Unicode MS Regular'],
        'text-size': 11, 'text-offset': [0, 0.9], 'text-anchor': 'top',
        'text-allow-overlap': false, 'text-optional': true, 'text-max-width': 9,
        visibility: track.visible === false ? 'none' : 'visible',
      },
      paint: { 'text-color': '#ffffff', 'text-halo-color': 'rgba(0,0,0,0.85)', 'text-halo-width': 1.5 },
    });
    S.map.on('click', wptId, (e) => {
      const f = e.features[0];
      const p = f.properties || {};
      const name = p.name || 'Waypoint';
      const desc = p.desc || p.cmt || '';
      const sym = p.sym || p.type || '';
      const ele = p.ele != null ? `<div class="wpt-meta">elev ${fmt.ele(Number(p.ele))} ft</div>` : '';
      const kindBadge = p._kind && p._kind !== 'generic' ? `<span class="wpt-kind kind-${p._kind}">${p._kind}</span>` : '';
      const html = `
        <div class="wpt-popup">
          <div class="wpt-name">${escapeHtml(name)} ${kindBadge}</div>
          ${sym && sym !== name ? `<div class="wpt-sym">${escapeHtml(sym)}</div>` : ''}
          ${desc ? `<div class="wpt-desc">${escapeHtml(desc).slice(0, 240)}${desc.length > 240 ? '\u2026' : ''}</div>` : ''}
          ${ele}
          <div class="wpt-coords">${f.geometry.coordinates[1].toFixed(5)}, ${f.geometry.coordinates[0].toFixed(5)}</div>
        </div>`;
      new maplibregl.Popup({ offset: 12, className: 'wpt-popup-wrap', maxWidth: '260px' })
        .setLngLat(e.lngLat).setHTML(html).addTo(S.map);
      if (!track.grouped) selectTrack(track.id);
    });
    S.map.on('mouseenter', wptId, () => S.map.getCanvas().style.cursor = 'pointer');
    S.map.on('mouseleave', wptId, () => S.map.getCanvas().style.cursor = '');
  }

  const startEnd = startEndCoords(track);
  if (startEnd) {
    const pinSource = sourceId + '-pins';
    S.map.addSource(pinSource, {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: [
          { type: 'Feature', geometry: { type: 'Point', coordinates: startEnd.start }, properties: { kind: 'start' } },
          { type: 'Feature', geometry: { type: 'Point', coordinates: startEnd.end }, properties: { kind: 'end' } },
        ],
      },
    });
    S.map.addLayer({
      id: startId, type: 'circle', source: pinSource,
      filter: ['==', ['get', 'kind'], 'start'],
      layout: { visibility: track.visible === false ? 'none' : 'visible' },
      paint: { 'circle-radius': 6, 'circle-color': '#6BCB77', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 },
    });
    S.map.addLayer({
      id: endId, type: 'circle', source: pinSource,
      filter: ['==', ['get', 'kind'], 'end'],
      layout: { visibility: track.visible === false ? 'none' : 'visible' },
      paint: { 'circle-radius': 6, 'circle-color': '#FF6B9D', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 },
    });
  }

  track.layerIds = [glowId, lineId, startId, endId, wptId, wptLabelId];

  S.map.on('click', lineId, (e) => {
    if (track.grouped) {
      const f = e.features && e.features[0];
      showFeaturePopup(track, f, e.lngLat);
    } else {
      selectTrack(track.id);
      showTrackPopup(track, e.lngLat);
    }
  });
  S.map.on('mouseenter', lineId, () => S.map.getCanvas().style.cursor = 'pointer');
  S.map.on('mouseleave', lineId, () => S.map.getCanvas().style.cursor = '');

  if (track.grouped) {
    let hoverId = null;
    S.map.on('mousemove', lineId, (e) => {
      const f = e.features && e.features[0];
      if (!f) return;
      const id = f.id != null ? f.id : (f.properties && f.properties.name);
      if (hoverId === id) return;
      hoverId = id;
      const name = (f.properties && f.properties.name) || '';
      showFeatureTooltip(name, e.lngLat);
    });
    S.map.on('mouseleave', lineId, () => { hoverId = null; hideFeatureTooltip(); });
  }
}

function showFeatureTooltip(name, lngLat) {
  if (!name) { hideFeatureTooltip(); return; }
  let el = document.getElementById('feat-tooltip');
  if (!el) {
    el = document.createElement('div');
    el.id = 'feat-tooltip';
    el.className = 'feat-tooltip';
    document.body.appendChild(el);
  }
  el.textContent = name;
  el.style.display = 'block';
  const p = S.map.project(lngLat);
  const rect = S.map.getContainer().getBoundingClientRect();
  el.style.left = (rect.left + p.x + 12) + 'px';
  el.style.top = (rect.top + p.y + 12) + 'px';
}
function hideFeatureTooltip() {
  const el = document.getElementById('feat-tooltip');
  if (el) el.style.display = 'none';
}

function showFeaturePopup(track, feature, lngLat) {
  const p = (feature && feature.properties) || {};
  const name = p.name || track.name;
  const s = p._stats;
  const lines = [];
  if (s) {
    if (s.distance > 0) lines.push(`<span class="lbl">Distance</span><span>${fmt.dist(s.distance)} mi</span>`);
    if (s.gain > 0)     lines.push(`<span class="lbl">Gain</span><span>${fmt.ele(s.gain)} ft</span>`);
    if (s.loss > 0)     lines.push(`<span class="lbl">Loss</span><span>${fmt.ele(s.loss)} ft</span>`);
    if (s.maxEle)       lines.push(`<span class="lbl">Max ele</span><span>${fmt.ele(s.maxEle)} ft</span>`);
  }
  const desc = p.desc || p.cmt;
  const html = `
    <div class="track-popup-name" style="color:${track.color}">${escapeHtml(name)}</div>
    ${desc ? `<div class="wpt-desc">${escapeHtml(String(desc).slice(0, 240))}${String(desc).length > 240 ? '\u2026' : ''}</div>` : ''}
    ${lines.length ? `<div class="track-popup-stats">${lines.join('')}</div>` : ''}
    <div class="fed-popup-agency">in ${escapeHtml(track.name)}</div>
  `;
  new maplibregl.Popup({ closeButton: true, closeOnClick: true, maxWidth: '280px' })
    .setLngLat(lngLat).setHTML(html).addTo(S.map);
}

function startEndCoords(track) {
  const f = track.geojson.features.find(f => f.geometry.type === 'LineString' || f.geometry.type === 'MultiLineString');
  if (!f) return null;
  if (f.geometry.type === 'LineString') {
    const c = f.geometry.coordinates;
    return { start: c[0], end: c[c.length - 1] };
  } else {
    const lines = f.geometry.coordinates;
    return { start: lines[0][0], end: lines[lines.length - 1][lines[lines.length - 1].length - 1] };
  }
}

function showTrackPopup(track, lngLat) {
  const s = track.stats;
  const html = `
    <div class="track-popup-name" style="color:${track.color}">${escapeHtml(track.name)}</div>
    <div class="track-popup-stats">
      <span class="lbl">Distance</span><span>${fmt.dist(s.distance)} mi</span>
      <span class="lbl">Gain</span><span>${fmt.ele(s.gain)} ft</span>
      <span class="lbl">Loss</span><span>${fmt.ele(s.loss)} ft</span>
      <span class="lbl">Max ele</span><span>${fmt.ele(s.maxEle)} ft</span>
      <span class="lbl">Min ele</span><span>${fmt.ele(s.minEle)} ft</span>
    </div>
  `;
  new maplibregl.Popup({ closeButton: true, closeOnClick: true, maxWidth: '260px' })
    .setLngLat(lngLat).setHTML(html).addTo(S.map);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function fitTrack(track) {
  const pts = track.allCoords.slice();
  for (const f of track.geojson.features) {
    if (f.geometry.type === 'Point') pts.push(f.geometry.coordinates);
    else if (f.geometry.type === 'MultiPoint') for (const c of f.geometry.coordinates) pts.push(c);
  }
  if (!pts.length) return;
  let minLng = pts[0][0], maxLng = pts[0][0], minLat = pts[0][1], maxLat = pts[0][1];
  for (const c of pts) {
    if (c[0] < minLng) minLng = c[0]; if (c[0] > maxLng) maxLng = c[0];
    if (c[1] < minLat) minLat = c[1]; if (c[1] > maxLat) maxLat = c[1];
  }
  if (Math.abs(maxLng - minLng) < 0.001 && Math.abs(maxLat - minLat) < 0.001) {
    const pad = 0.01;
    minLng -= pad; maxLng += pad; minLat -= pad; maxLat += pad;
  }
  S.map.fitBounds([[minLng, minLat], [maxLng, maxLat]], { padding: 80, duration: 900, maxZoom: 14 });
}

function fitAllTracks() {
  if (!S.tracks.size) { toast('No tracks loaded'); return; }
  let minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
  let any = false;
  const visit = (c) => {
    any = true;
    if (c[0] < minLng) minLng = c[0]; if (c[0] > maxLng) maxLng = c[0];
    if (c[1] < minLat) minLat = c[1]; if (c[1] > maxLat) maxLat = c[1];
  };
  for (const t of S.tracks.values()) {
    for (const c of t.allCoords) visit(c);
    for (const f of t.geojson.features) {
      if (f.geometry.type === 'Point') visit(f.geometry.coordinates);
      else if (f.geometry.type === 'MultiPoint') for (const c of f.geometry.coordinates) visit(c);
    }
  }
  if (!any) return;
  S.map.fitBounds([[minLng, minLat], [maxLng, maxLat]], { padding: 80, duration: 900, maxZoom: 14 });
}

function removeTrack(id) {
  const t = S.tracks.get(id);
  if (!t) return;
  if (t.pinned) {
    toast('Library tracks (camping, peaks) are pinned. Edit /manifest.json to remove.', 'info');
    return;
  }
  for (const layerId of t.layerIds || []) if (S.map.getLayer(layerId)) S.map.removeLayer(layerId);
  if (S.map.getSource(`track-${id}`)) S.map.removeSource(`track-${id}`);
  if (S.map.getSource(`track-${id}-pins`)) S.map.removeSource(`track-${id}-pins`);
  if (S.map.getSource(`track-${id}-wpt-src`)) S.map.removeSource(`track-${id}-wpt-src`);
  S.tracks.delete(id);
  if (S.selectedTrackId === id) { S.selectedTrackId = null; hideElevation(); }
  buildTracksUI();
  Store.saveTracks();
}

function selectTrack(id) {
  S.selectedTrackId = id;
  buildTracksUI();
  const t = S.tracks.get(id);
  if (t) showElevation(t);
}

          <button class="track-act" data-act="settings" title="Style">\u2699</button>
          <button class="track-act" data-act="visibility" title="Show/hide">${eyeIcon}</button>
          <button class="track-act" data-act="fit" title="Fit to view">\u2922</button>

          <div class="track-setting-row">

            <div class="color-palette">

    if (opSlider) {
      opSlider.addEventListener('input', (e) => {

function setTrackVisible(id, visible) {
  const t = S.tracks.get(id);

function setTrackColor(id, color) {

function setTrackLineWidth(id, w) {

// ELEVATION PROFILE (Chart.js) — lazy-loaded
// ============================================================
async function ensureChartJs() {
  if (window.Chart) return;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js';
    s.onload = res;
    s.onerror = () => rej(new Error('Chart.js failed to load'));
    document.head.appendChild(s);
  });
}

async function showElevation(track) {
  try { await ensureChartJs(); }
  catch (e) { toast('Chart.js failed to load', 'error'); return; }
  S.elevTrackId = track.id;
  $('#elevation-panel').classList.add('show');
  $('#elev-name').textContent = track.name;
  $('#elev-swatch').style.background = track.color;

  const s = track.stats;
  $('#elev-stats').innerHTML = `
    <span class="stat">DIST<span class="v">${fmt.dist(s.distance)} mi</span></span>
    <span class="stat">\u2191<span class="v">${fmt.ele(s.gain)} ft</span></span>
    <span class="stat">\u2193<span class="v">${fmt.ele(s.loss)} ft</span></span>
    <span class="stat">MAX<span class="v">${fmt.ele(s.maxEle)} ft</span></span>
  `;

  const n = track.allCoords.length;
  const targetPoints = 600;
  const step = Math.max(1, Math.floor(n / targetPoints));
  const data = [];
  const labels = [];
  for (let i = 0; i < n; i += step) {
    data.push({ x: s.cumDist[i] * 0.000621371, y: s.smoothEle[i] * 3.28084 });
    labels.push(s.cumDist[i] * 0.000621371);
  }
  if ((n - 1) % step !== 0) {
    data.push({ x: s.cumDist[n - 1] * 0.000621371, y: s.smoothEle[n - 1] * 3.28084 });
  }

  const segColors = [];
  for (let i = 1; i < data.length; i++) {
    const dDist = (data[i].x - data[i - 1].x) * 1609.34;
    const dEle  = (data[i].y - data[i - 1].y) * 0.3048;
    const gradePct = dDist > 1 ? (dEle / dDist) * 100 : 0;
    segColors.push(colorForGrade(gradePct));
  }

  const ctx = document.getElementById('elev-canvas').getContext('2d');
  if (S.elevChart) S.elevChart.destroy();
  S.elevChart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [{
        data,
        borderColor: track.color,
        borderWidth: 2,
        fill: true,
        backgroundColor: (c) => {
          const g = c.chart.ctx.createLinearGradient(0, 0, 0, c.chart.height);
          g.addColorStop(0, hexToRgba(track.color, 0.45));
          g.addColorStop(1, hexToRgba(track.color, 0.02));
          return g;
        },
        pointRadius: 0,
        tension: 0.25,
        segment: { borderColor: (c) => segColors[c.p0DataIndex] || track.color },
      }]
    },
    options: {
      maintainAspectRatio: false,
      animation: { duration: 300 },
      interaction: { intersect: false, mode: 'index' },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: {
          type: 'linear',
          ticks: { color: '#5a6178', font: { family: 'JetBrains Mono', size: 9 }, callback: (v) => v.toFixed(1) + ' mi' },
          grid: { color: 'rgba(255,255,255,0.04)' },
        },
        y: {
          ticks: { color: '#5a6178', font: { family: 'JetBrains Mono', size: 9 }, callback: (v) => v.toLocaleString() + ' ft' },
          grid: { color: 'rgba(255,255,255,0.04)' },
        },
      },
      onHover: (e, items) => {
        if (!items.length) {
          if (S.hoverMarker) { S.hoverMarker.remove(); S.hoverMarker = null; }
          $('#elev-readout').classList.remove('show');
          return;
        }
        const idx = items[0].index;
        const pt = data[idx];
        const targetMeters = pt.x / 0.000621371;
        const origIdx = nearestCoordIndex(track, targetMeters);
        const coord = track.allCoords[origIdx];
        if (coord) {
          if (!S.hoverMarker) {
            const el = document.createElement('div');
            el.className = 'hover-marker';
            S.hoverMarker = new maplibregl.Marker({ element: el })
              .setLngLat([coord[0], coord[1]]).addTo(S.map);
          } else {
            S.hoverMarker.setLngLat([coord[0], coord[1]]);
          }
          $('#elev-readout').classList.add('show');
          $('#elev-readout').textContent = `${pt.x.toFixed(2)} mi \u00b7 ${Math.round(pt.y).toLocaleString()} ft`;
        }
      },
    }
  });
}

function nearestCoordIndex(track, targetMeters) {
  const cd = track.stats.cumDist;
  let lo = 0, hi = cd.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (cd[mid] < targetMeters) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function colorForGrade(pct) {
  const a = Math.abs(pct);
  if (a < 4) return '#6BCB77';
  if (a < 10) return '#FFD93D';
  if (a < 18) return '#FF9F5A';
  if (a < 30) return '#FF6B35';
  return '#FF6B9D';
}

function hexToRgba(hex, a) {
  const m = hex.match(/^#([0-9a-f]{6})$/i);
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${a})`;
}

function hideElevation() {
  $('#elevation-panel').classList.remove('show');
  if (S.hoverMarker) { S.hoverMarker.remove(); S.hoverMarker = null; }
  S.elevTrackId = null;
}

async function showWeatherAt(lng, lat) {
  if (S.weatherMarker) S.weatherMarker.remove();
  const el = document.createElement('div');
  el.className = 'weather-marker';
  S.weatherMarker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(S.map);

  $('#weather-panel').classList.add('show');
  $('#weather-content').innerHTML = `<div class="weather-loading"><div class="spinner"></div>Loading forecast\u2026</div>`;

  try {
    const params = new URLSearchParams({
      latitude: lat.toFixed(4),
      longitude: lng.toFixed(4),
      current: 'temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,apparent_temperature',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,snowfall_sum,sunrise,sunset',
      hourly: 'temperature_2m,precipitation_probability,snowfall',
      temperature_unit: 'celsius',
      wind_speed_unit: 'kmh',
      timezone: 'auto',
      forecast_days: 7,
    });
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    renderWeather(data, lng, lat);
  } catch (e) {

function renderWeather(data, lng, lat) {
  const c = data.current;
  const d = data.daily;
  const [icon, label] = WMO_ICONS[c.weather_code] || ['\u2753', '\u2014'];

  const allTemps = [...d.temperature_2m_max, ...d.temperature_2m_min];
  const tMin = Math.min(...allTemps);
  const tMax = Math.max(...allTemps);

  const sunrise = new Date(d.sunrise[0]);
  const sunset  = new Date(d.sunset[0]);
  const fmtTime = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  const windDir = c.wind_direction_10m;
  const compass = compassFromDeg(windDir);

  const forecastHtml = d.time.map((t, i) => {
    const date = new Date(t);
    const day = i === 0 ? 'Today' : DAY_NAMES[date.getDay()];
    const [ic] = WMO_ICONS[d.weather_code[i]] || ['\u2753'];
    const hi = fmt.temp(d.temperature_2m_max[i]);
    const lo = fmt.temp(d.temperature_2m_min[i]);
    const precip = d.precipitation_probability_max[i] ?? 0;
    const snow = d.snowfall_sum[i] ?? 0;
    const barLeft  = ((d.temperature_2m_min[i] - tMin) / (tMax - tMin)) * 100;
    const barWidth = ((d.temperature_2m_max[i] - d.temperature_2m_min[i]) / (tMax - tMin)) * 100;
    return `
      <div class="forecast-row" title="${WMO_ICONS[d.weather_code[i]]?.[1] || ''}">
        <div class="forecast-day">${day}</div>
        <div class="forecast-icon">${ic}</div>
        <div class="forecast-bar">
          <div class="forecast-bar-fill" style="left:${barLeft}%;width:${Math.max(barWidth, 8)}%"></div>
        </div>
        <div class="forecast-temps">
          <span class="forecast-hi">${hi}\u00b0</span><span class="forecast-lo">${lo}\u00b0</span>
          ${precip > 10 ? `<span class="forecast-precip" style="display:block">${precip}% \u00b7 ${snow > 0.1 ? fmt.snow(snow) + '"\u2744' : ''}</span>` : ''}
        </div>
      </div>`;
  }).join('');

  const avalanche = avalancheLink(lat, lng);

  $('#weather-content').innerHTML = `
    <div class="weather-header">
      <div>
        <div class="weather-title">Forecast</div>
        <div class="weather-loc">${fmt.ll(lat, 4)}, ${fmt.ll(lng, 4)}</div>
      </div>
      <button class="weather-close" id="weather-close-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </div>
    <div class="weather-current">
      <div class="weather-icon-big">${icon}</div>
      <div>
        <div class="weather-temp-big">${fmt.temp(c.temperature_2m)}\u00b0<span style="font-size:14px;color:var(--text-dim);font-weight:500"> F</span></div>
        <div class="weather-cond">${label}</div>
      </div>
    </div>
    <div class="weather-meta">
      <div class="item"><div class="lbl">Feels</div><div class="val">${fmt.temp(c.apparent_temperature)}\u00b0</div></div>
      <div class="item"><div class="lbl">Wind</div><div class="val">${fmt.wind(c.wind_speed_10m)} mph ${compass}</div></div>
      <div class="item"><div class="lbl">Humidity</div><div class="val">${Math.round(c.relative_humidity_2m)}%</div></div>
      <div class="item"><div class="lbl">Sun</div><div class="val">${fmtTime(sunrise)}\u2013${fmtTime(sunset)}</div></div>
    </div>
    <div class="weather-forecast">${forecastHtml}</div>
    <a class="avalanche-link" href="${avalanche.url}" target="_blank" rel="noopener">
      <span style="font-size:14px">\u26A0\uFE0F</span>
      <span>${avalanche.label}</span>
      <svg class="ext" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 4h6v6M20 4L10 14M5 5h4M5 19h14v-9"/>
      </svg>
    </a>
  `;
  $('#weather-close-btn').onclick = () => {
    $('#weather-panel').classList.remove('show');
    if (S.weatherMarker) { S.weatherMarker.remove(); S.weatherMarker = null; }
  };
}

function compassFromDeg(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

function avalancheLink(lat, lng) {
  const inCO = lat >= 36.99 && lat <= 41.01 && lng >= -109.06 && lng <= -102.04;
  if (inCO) {
    let zone = 'front-range';
    if (lng < -107.0 && lat > 38.7) zone = 'northern-mountains';
    else if (lng < -107.0 && lat <= 38.7) zone = 'southern-mountains';
    else if (lng < -106.0 && lat >= 39.0) zone = 'vail-summit';
    else if (lng < -106.0 && lat < 39.0) zone = 'sawatch';
    else if (lng < -105.5) zone = 'gore-tenmile';
    else zone = 'front-range';
    return {
      url: `https://avalanche.state.co.us/forecasts/backcountry-avalanche/`,
      label: `CAIC forecast \u00b7 ${zone.replace('-', ' ')}`,
    };
  }
  return {
    url: `https://avalanche.org/#/current?lat=${lat.toFixed(3)}&lng=${lng.toFixed(3)}`,
    label: 'Avalanche forecast (avalanche.org)',
  };
}

// ============================================================
// SEARCH (Nominatim)
// ============================================================
const debouncedSearch = debounce(async (q) => {
  if (!q.trim()) { $('#search-results').classList.remove('show'); return; }
  if (S.searchAbort) S.searchAbort.abort();
  S.searchAbort = new AbortController();
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&countrycodes=us&addressdetails=1`,
      { signal: S.searchAbort.signal, headers: { 'Accept-Language': 'en' } }
    );
    const results = await r.json();
    const box = $('#search-results');
    if (!results.length) { box.innerHTML = '<div class="search-result" style="color:var(--text-muted)">No results</div>'; box.classList.add('show'); return; }
    box.innerHTML = results.map(item => {
      const name = item.namedetails?.name || item.display_name.split(',')[0];
      const sub = item.display_name.split(',').slice(1, 3).join(',').trim();
      return `<div class="search-result" data-lat="${item.lat}" data-lng="${item.lon}" data-bb="${JSON.stringify(item.boundingbox)}">
        <div>${escapeHtml(name)}</div>
        <div class="sub">${escapeHtml(sub)}</div>
      </div>`;
    }).join('');
    box.classList.add('show');
    box.querySelectorAll('.search-result').forEach(el => {
      el.onclick = () => {
        const bb = JSON.parse(el.dataset.bb);
        S.map.fitBounds([[parseFloat(bb[2]), parseFloat(bb[0])], [parseFloat(bb[3]), parseFloat(bb[1])]], { padding: 80, duration: 900, maxZoom: 14 });
        $('#search-input').value = el.querySelector('div').textContent;
        box.classList.remove('show');
      };
    });
  } catch (e) { if (e.name !== 'AbortError') console.warn('Search error', e); }
}, 380);

// ============================================================
// WIRE CONTROLS
// ============================================================
function wireControls() {
  // Sidebar toggle
  $('#sidebar-toggle').onclick = () => {
    $('#app').classList.toggle('sidebar-collapsed');
    setTimeout(() => S.map.resize(), 300);
  };
  $('#sidebar-header').onclick = (e) => {
    if (window.innerWidth > 720) return;
    e.currentTarget.closest('#sidebar').classList.toggle('open');
  };

  // Search
  const si = $('#search-input');
  si.addEventListener('input', (e) => debouncedSearch(e.target.value));
  si.addEventListener('keydown', (e) => { if (e.key === 'Escape') { si.value = ''; $('#search-results').classList.remove('show'); } });
  document.addEventListener('click', (e) => { if (!e.target.closest('.search-wrap')) $('#search-results').classList.remove('show'); });

  // Map controls
  $('#btn-zoom-in').onclick = () => S.map.zoomIn();
  $('#btn-zoom-out').onclick = () => S.map.zoomOut();
  $('#btn-3d').onclick = () => setTerrain(!S.terrain);
  $('#btn-fit').onclick = () => fitAllTracks();
  $('#btn-fullscreen').onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  };
  $('#btn-locate').onclick = () => {
    navigator.geolocation?.getCurrentPosition(
      (p) => S.map.flyTo({ center: [p.coords.longitude, p.coords.latitude], zoom: 13, duration: 1200 }),
      () => toast('Location unavailable', 'error')
    );
  };
  $('#btn-pin').onclick = () => setPinMode(!S.pinMode);
  $('#btn-measure').onclick = () => setMeasureMode(!S.measure.active);

  // Status bar — copy coords
  $('#copy-coords').onclick = () => {
    const lat = $('#stat-lat').textContent;
    const lng = $('#stat-lng').textContent;
    if (lat === '—') return;
    navigator.clipboard?.writeText(`${lat}, ${lng}`).then(() => toast('Copied coords', 'success'));
  };

  // GPX file input
  S.fileInput = $('#file-input');
  $('#btn-load-gpx').onclick = () => S.fileInput.click();
  S.fileInput.onchange = async (e) => {
    for (const file of e.target.files) await loadGPXFile(file);
    e.target.value = '';
  };

  // Drag-and-drop GPX
  const container = $('#map-container');
  container.addEventListener('dragover', (e) => { e.preventDefault(); $('#drop-overlay').classList.add('show'); });
  container.addEventListener('dragleave', (e) => { if (!container.contains(e.relatedTarget)) $('#drop-overlay').classList.remove('show'); });
  container.addEventListener('drop', async (e) => {
    e.preventDefault();
    $('#drop-overlay').classList.remove('show');
    const files = [...e.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith('.gpx'));
    if (!files.length) { toast('Drop a .gpx file', 'error'); return; }
    for (const file of files) await loadGPXFile(file);
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === '3') setTerrain(!S.terrain);
    if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
    if (e.key === '/') { e.preventDefault(); si.focus(); }
    if (e.key === 'Escape') {
      $('#search-results').classList.remove('show');
      if (S.measure.active) { setMeasureMode(false); clearMeasure(); }
      if (S.pinMode) setPinMode(false);
      $('#weather-panel').classList.remove('show');
      if (S.weatherMarker) { S.weatherMarker.remove(); S.weatherMarker = null; }
    }
    if (e.key === 'p' || e.key === 'P') setPinMode(!S.pinMode);
    if (e.key === 'm' || e.key === 'M') setMeasureMode(!S.measure.active);
    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
      e.preventDefault();
      $('#app').classList.toggle('sidebar-collapsed');
      setTimeout(() => S.map.resize(), 300);
    }
  });

  // North arrow click to reset bearing
  $('#north-arrow').addEventListener('click', () => {
    S.map.easeTo({ bearing: 0, duration: 400 });
  });

  ensureMeasureLayers();
}

// ============================================================
// MANIFEST AUTO-LOAD
// ============================================================
async function tryManifest() {
  try {
    let r = await fetch('./manifest.json', { cache: 'no-cache' });
    if (!r.ok) r = await fetch('./gpx/manifest.json', { cache: 'no-cache' });
    if (!r.ok) return;
    const m = await r.json();
    if (!Array.isArray(m.files)) return;

    const styleOverrides = Store.loadTrackStyles();
    let loaded = 0;
    for (const entry of m.files) {
      const file = typeof entry === 'string' ? entry : entry.file;
      const name = typeof entry === 'string' ? null : entry.name;
      const grouped = typeof entry === 'object' && entry.grouped === true;
      const groupByGeomType = typeof entry === 'object' && entry.groupByGeomType === true;
      if (!file) continue;
      const url = `./gpx/${file}`;
      const dupeIds = [];
      for (const [id, t] of S.tracks) {
        if (t.source === url || t.source === file) dupeIds.push(id);
      }
      for (const id of dupeIds) {
        const t = S.tracks.get(id);
        if (!t) continue;
        for (const layerId of t.layerIds || []) if (S.map.getLayer(layerId)) S.map.removeLayer(layerId);
        if (S.map.getSource(`track-${id}`)) S.map.removeSource(`track-${id}`);
        if (S.map.getSource(`track-${id}-pins`)) S.map.removeSource(`track-${id}-pins`);
        if (S.map.getSource(`track-${id}-wpt-src`)) S.map.removeSource(`track-${id}-wpt-src`);
        S.tracks.delete(id);
      }
      const t = await loadGPXFromURL(url, name, { grouped, groupByGeomType });
      if (t) {
        const all = t.siblings || [t];
        const ov = styleOverrides[url];
        for (const sib of all) {
          sib.pinned = true;
          if (ov) {
            if (ov.color) setTrackColor(sib.id, ov.color);
            if (ov.lineWidth) setTrackLineWidth(sib.id, ov.lineWidth);
            if (ov.opacity != null) setTrackOpacity(sib.id, ov.opacity);
            if (ov.visible === false) setTrackVisible(sib.id, false);
          }
        }
        loaded += all.length;
      }
    }
    if (loaded > 0) {
      buildTracksUI();
      Store.saveTracks();
      toast(`Loaded ${loaded} track${loaded === 1 ? '' : 's'} from library`, 'success');
    }
  } catch (e) { /* no manifest, that's fine */ }
}

// ============================================================
// RESTORE PERSISTED TRACKS
// ============================================================
function restorePersistedTracks() {
  const arr = Store.loadTracks();
  if (!arr.length) return;
  for (const t of arr) {
    const allCoords = [];
    for (const f of t.geojson.features) {
      if (f.geometry.type === 'LineString')
        for (const c of f.geometry.coordinates) allCoords.push(c);
      else if (f.geometry.type === 'MultiLineString')
        for (const line of f.geometry.coordinates)
          for (const c of line) allCoords.push(c);
    }
    const stats = calcStats(allCoords);
    const track = { ...t, stats, allCoords };
    S.tracks.set(t.id, track);
    renderTrackOnMap(track);
  }
  buildTracksUI();
}

// ============================================================
// BOOT
// ============================================================
(async function init() {
  await initMap();
  buildBasemapUI();
  buildLayersUI();
  buildTerrainUI();
  wireControls();
  S.pins = Store.loadPins();
  ensurePinLayers();
  refreshPinLayer();
  restorePersistedTracks();
  await tryManifest();
})();
</script>

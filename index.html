<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0c12" />
<title>Alec's Backcountry map</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- MapLibre -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<!-- Chart.js loaded lazily on first elevation profile open (see ensureChartJs). -->

<style>
  :root {
    --bg-deep: #0a0c12;
    --bg-sidebar: #0f1117;
    --bg-card: #181b25;
    --bg-elevated: #1f2330;
    --bg-glass: rgba(15, 17, 23, 0.72);
    --border: #232733;
    --border-strong: #2d3243;
    --text: #e8eaf0;
    --text-dim: #8b92a6;
    --text-muted: #5a6178;
    --accent: #FF6B35;
    --accent-soft: #ff8758;
    --accent-glow: rgba(255, 107, 53, 0.35);
    --cold: #4A9EFF;
    --cold-glow: rgba(74, 158, 255, 0.35);
    --success: #6BCB77;
    --warning: #FFD93D;
    --danger: #FF6B9D;

    --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;

    --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.45);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.55);

    --sidebar-w: 340px;
    --t-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);
    --t-med: 280ms cubic-bezier(0.4, 0, 0.2, 1);
    --t-slow: 480ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-deep);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    overscroll-behavior: none;
  }

  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }

  /* === LAYOUT === */
  #app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    width: 100vw; height: 100vh;
    transition: grid-template-columns var(--t-med);
  }
  #app.sidebar-collapsed { grid-template-columns: 0 1fr; }
  #app.sidebar-collapsed #sidebar { transform: translateX(-100%); }

  /* === SIDEBAR === */
  #sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform var(--t-med);
    position: relative;
    z-index: 10;
  }

  /* Topographic line texture overlay on sidebar */
  #sidebar::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(ellipse 800px 600px at 50% -20%, rgba(255,107,53,0.06), transparent 50%),
      repeating-linear-gradient(135deg, transparent 0 28px, rgba(255,255,255,0.012) 28px 29px);
    pointer-events: none;
  }

  .sidebar-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 16px; letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent) 0%, #ff4d2e 100%);
    border-radius: 7px;
    position: relative;
    box-shadow: 0 4px 12px var(--accent-glow);
    flex-shrink: 0;
  }
  .brand-mark::after {
    content: '';
    position: absolute; inset: 4px;
    background: var(--bg-sidebar);
    clip-path: polygon(0 100%, 30% 60%, 50% 75%, 70% 30%, 100% 100%);
    border-radius: 3px;
  }
  .brand-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 12px 80px;
    position: relative;
    z-index: 1;
  }
  .sidebar-content::-webkit-scrollbar { width: 6px; }
  .sidebar-content::-webkit-scrollbar-track { background: transparent; }
  .sidebar-content::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 3px;
  }

  .panel { margin-bottom: 18px; }
  .panel-title {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 8px 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .panel-title .count {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 999px;
    color: var(--text-dim);
    font-size: 10px;
  }

  .load-gpx {
    width: 100%;
    padding: 12px 14px;
    background: linear-gradient(180deg, var(--accent) 0%, #e85a25 100%);
    color: white;
    border-radius: var(--r-md);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.01em;
    box-shadow: 0 4px 14px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.18);
    transition: transform var(--t-fast), box-shadow var(--t-fast);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .load-gpx:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .load-gpx:active { transform: translateY(0); }

  .track-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 10px 12px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all var(--t-fast);
    position: relative;
    overflow: hidden;
  }
  .track-item:hover { border-color: var(--border-strong); background: var(--bg-elevated); }
  .track-item.active {
    border-color: var(--accent);
    background: var(--bg-elevated);
    box-shadow: 0 0 0 1px var(--accent), 0 4px 14px rgba(0,0,0,0.4);
  }
  .track-item-color {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    cursor: pointer;
    transition: width var(--t-fast);
  }
  .track-item-color:hover { width: 6px; }
  .track-item.hidden { opacity: 0.45; }
  .track-item.hidden .track-item-name,
  .track-item.hidden .track-item-stats { color: var(--text-muted); }
  .track-item.expanded { padding-bottom: 4px; }
  .track-item-name {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 6px;
    padding-left: 8px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .track-item-stats {
    display: flex;
    gap: 12px;
    padding-left: 8px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
  }
  .track-item-stat { display: flex; gap: 3px; align-items: baseline; }
  .track-item-stat .label { color: var(--text-muted); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .track-item-actions {
    position: absolute;
    top: 8px; right: 8px;
    display: flex; gap: 4px;
    opacity: 0;
    transition: opacity var(--t-fast);
  }
  .track-item:hover .track-item-actions, .track-item.active .track-item-actions, .track-item.expanded .track-item-actions { opacity: 1; }
  .track-act {
    width: 22px; height: 22px;
    border-radius: 5px;
    background: rgba(0,0,0,0.4);
    color: var(--text-dim);
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--t-fast);
    border: none;
    cursor: pointer;
  }
  .track-act:hover { background: rgba(0,0,0,0.7); color: var(--text); }
  .track-act.danger:hover { color: var(--danger); }
  .track-act svg { display: block; }

  .track-settings {
    margin-top: 8px;
    padding: 10px 8px 4px 8px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .track-setting-row { display: flex; flex-direction: column; gap: 5px; }
  .track-setting-row label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .track-setting-row label .lw-val,
  .track-setting-row label .op-val {
    color: var(--text-dim);
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
  }
  .color-palette { display: flex; flex-wrap: wrap; gap: 4px; }
  .color-swatch {
    width: 18px; height: 18px;
    border-radius: 4px;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all var(--t-fast);
    padding: 0;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active {
    border-color: var(--text);
    box-shadow: 0 0 0 2px var(--bg-elevated), 0 0 0 3px var(--accent);
  }
  .lw-slider, .op-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    height: 4px;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .lw-slider::-webkit-slider-thumb, .op-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg-elevated);
    cursor: pointer;
  }
  .lw-slider::-moz-range-thumb, .op-slider::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg-elevated);
    cursor: pointer;
  }
  .empty-state {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    border: 1px dashed var(--border);
    border-radius: var(--r-md);
  }

  .layer-toggle {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--t-fast);
    user-select: none;
  }
  .layer-toggle:hover { background: var(--bg-card); }
  .layer-swatch {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
  }
  .layer-label { flex: 1; font-size: 13px; }
  .layer-label .sub {
    display: block;
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .switch {
    width: 32px; height: 18px;
    background: var(--border);
    border-radius: 999px;
    position: relative;
    transition: background var(--t-fast);
    flex-shrink: 0;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: all var(--t-fast);
  }
  .layer-toggle.on .switch { background: var(--accent); }
  .layer-toggle.on .switch::after { left: 16px; background: white; }

  .basemap-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .basemap-btn {
    padding: 8px 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-size: 11px;
    color: var(--text-dim);
    transition: all var(--t-fast);
    text-align: center;
    font-weight: 500;
  }
  .basemap-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .basemap-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-weight: 600;
  }

  #map-container { position: relative; overflow: hidden; }
  #map { position: absolute; inset: 0; background: #050709; }

  .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { display: none; }
  .maplibregl-popup { z-index: 5; }
  .maplibregl-popup-content {
    background: var(--bg-glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    color: var(--text);
    padding: 12px 14px;
    box-shadow: var(--shadow-md);
    font-family: var(--font-sans);
  }
  .maplibregl-popup-tip { display: none; }
  .maplibregl-popup-close-button {
    color: var(--text-dim);
    font-size: 18px;
    padding: 2px 6px;
    right: 4px; top: 4px;
  }
  .maplibregl-popup-close-button:hover { background: transparent; color: var(--text); }

  .map-overlay { position: absolute; z-index: 4; pointer-events: none; }
  .map-overlay > * { pointer-events: auto; }

  .top-bar {
    top: 16px; left: 16px; right: 16px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .top-bar > * { pointer-events: auto; }

  .sidebar-toggle {
    width: 40px; height: 40px;
    background: var(--bg-glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
    transition: all var(--t-fast);
  }
  .sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }

  .search-wrap { flex: 1; max-width: 460px; position: relative; }
  .search-input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    background: var(--bg-glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    font-size: 13px;
    color: var(--text);
    box-shadow: var(--shadow-sm);
    transition: border-color var(--t-fast);
    outline: none;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { border-color: var(--accent); }
  .search-icon {
    position: absolute;
    left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
  }
  .search-results {
    position: absolute;
    top: calc(100% + 6px); left: 0; right: 0;
    background: var(--bg-glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-md);
    max-height: 280px;
    overflow-y: auto;
    display: none;
  }
  .search-results.show { display: block; }
  .search-result {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    transition: background var(--t-fast);
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover { background: rgba(255,255,255,0.04); }
  .search-result .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .map-controls {
    position: absolute;
    top: 72px; right: 16px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 4;
  }
  .map-ctrl {
    width: 40px; height: 40px;
    background: var(--bg-glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
    transition: all var(--t-fast);
    pointer-events: auto;
  }
  .map-ctrl:hover { border-color: var(--accent); color: var(--accent); }
  .map-ctrl.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .map-ctrl-group {
    display: flex; flex-direction: column;
    background: var(--bg-glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .map-ctrl-group .map-ctrl {
    background: transparent;
    backdrop-filter: none;
    border: none;
    border-radius: 0;
    border-bottom: 1px solid var(--border);
    box-shadow: none;
    width: 40px; height: 40px;
  }
  .map-ctrl-group .map-ctrl:last-child { border-bottom: none; }
  .map-ctrl-group .map-ctrl:hover { background: rgba(255,255,255,0.05); color: var(--accent); }
  .map-ctrl-group .map-ctrl.active { background: var(--accent); color: white; }

  .weather-panel {
    position: absolute;
    top: 16px; right: 70px;
    width: 320px;
    background: var(--bg-glass);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    z-index: 5;
    transform: translateX(20px);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-med), transform var(--t-med);
  }
  .weather-panel.show { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .weather-header {
    padding: 14px 16px 10px;
    display: flex; justify-content: space-between; align-items: flex-start;
    border-bottom: 1px solid var(--border);
  }
  .weather-loc { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); letter-spacing: 0.02em; }
  .weather-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .weather-close {
    color: var(--text-dim);
    width: 24px; height: 24px;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--t-fast);
    margin: -4px -4px 0 0;
  }
  .weather-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .weather-current {
    padding: 18px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(180deg, rgba(74,158,255,0.06) 0%, transparent 100%);
  }
  .weather-icon-big { font-size: 56px; line-height: 1; flex-shrink: 0; }
  .weather-temp-big {
    font-size: 38px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
    font-family: var(--font-mono);
  }
  .weather-cond { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .weather-meta {
    display: flex;
    gap: 12px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
  }
  .weather-meta .item { display: flex; flex-direction: column; gap: 1px; }
  .weather-meta .lbl { color: var(--text-muted); font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; }
  .weather-meta .val { color: var(--text); font-weight: 500; font-size: 11px; }

  .weather-forecast { padding: 8px 8px 12px; border-top: 1px solid var(--border); }
  .forecast-row {
    display: grid;
    grid-template-columns: 38px 28px 1fr 60px;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: var(--r-sm);
  }
  .forecast-row:hover { background: rgba(255,255,255,0.03); }
  .forecast-day { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }
  .forecast-icon { font-size: 18px; text-align: center; }
  .forecast-bar {
    height: 5px; background: var(--bg-card);
    border-radius: 999px;
    position: relative;
    overflow: hidden;
  }
  .forecast-bar-fill {
    position: absolute;
    height: 100%;
    background: linear-gradient(90deg, var(--cold), var(--accent));
    border-radius: 999px;
  }
  .forecast-temps { text-align: right; font-family: var(--font-mono); font-size: 11px; }
  .forecast-hi { color: var(--text); font-weight: 600; }
  .forecast-lo { color: var(--text-muted); margin-left: 4px; }
  .forecast-precip { font-family: var(--font-mono); font-size: 9px; color: var(--cold); margin-left: 4px; }

  .avalanche-link {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: linear-gradient(90deg, rgba(255,107,53,0.08), transparent);
    border-top: 1px solid var(--border);
    color: var(--accent);
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    transition: background var(--t-fast);
  }
  .avalanche-link:hover { background: linear-gradient(90deg, rgba(255,107,53,0.15), rgba(255,107,53,0.04)); }
  .avalanche-link .ext { margin-left: auto; opacity: 0.6; }

  .weather-loading { padding: 40px 16px; text-align: center; color: var(--text-dim); }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 10px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .elevation-panel {
    position: absolute;
    bottom: 32px; left: 16px; right: 16px;
    height: 200px;
    background: var(--bg-glass);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
    z-index: 4;
    transform: translateY(220px);
    transition: transform var(--t-med);
    overflow: hidden;
  }
  .elevation-panel.show { transform: translateY(0); }
  .elevation-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .elevation-title { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .elevation-title .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .elevation-stats { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); display: flex; gap: 14px; }
  .elevation-stats .stat .v { color: var(--text); font-weight: 600; margin-left: 3px; }
  .elevation-canvas-wrap { height: calc(100% - 38px); padding: 4px 8px 6px; position: relative; }
  .elevation-readout {
    position: absolute;
    top: 8px; left: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text);
    background: rgba(0,0,0,0.6);
    padding: 4px 8px;
    border-radius: 5px;
    pointer-events: none;
    opacity: 0;
    transition: opacity var(--t-fast);
  }
  .elevation-readout.show { opacity: 1; }

  .status-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 28px;
    background: var(--bg-glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
    z-index: 3;
    gap: 18px;
  }
  .status-item { display: flex; gap: 6px; align-items: center; }
  .status-item .lbl { color: var(--text-muted); }
  .status-item .v { color: var(--text); }
  .status-item.clickable-coords {
    cursor: pointer; padding: 2px 8px; margin-left: -8px;
    border-radius: 4px; transition: background var(--t-fast);
  }
  .status-item.clickable-coords:hover { background: rgba(255,255,255,0.06); }
  .status-item.clickable-coords .copy-hint {
    margin-left: 8px; color: var(--accent); font-size: 9.5px;
    text-transform: uppercase; letter-spacing: 0.06em;
    opacity: 0; transition: opacity var(--t-fast);
  }
  .status-item.clickable-coords:hover .copy-hint { opacity: 1; }
  .status-spacer { flex: 1; }

  .scale-bar {
    position: absolute;
    bottom: 38px; left: 16px;
    background: var(--bg-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    z-index: 3;
    user-select: none;
  }
  .scale-bar-line {
    height: 4px;
    background: var(--text);
    margin-top: 2px;
    border-left: 1px solid var(--text);
    border-right: 1px solid var(--text);
    border-bottom: 1px solid var(--text);
  }

  .north-arrow {
    position: absolute;
    bottom: 38px; right: 16px;
    width: 36px; height: 36px;
    background: var(--bg-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 50%;
    z-index: 3;
    display: flex; align-items: center; justify-content: center;
    transition: transform var(--t-fast);
  }
  .north-arrow svg { color: var(--text); }
  .north-arrow .n-marker { fill: var(--accent); }

  .legend {
    position: absolute;
    bottom: 38px; left: 110px;
    background: var(--bg-glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    padding: 8px 10px;
    font-size: 11px;
    color: var(--text);
    z-index: 3;
    display: none;
  }
  .legend.show { display: block; }
  .legend-title {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .legend-item:last-child { margin-bottom: 0; }
  .legend-swatch { width: 14px; height: 10px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.1); }
  .legend-swatch.slope-swatch {
    width: 28px;
    background: linear-gradient(to right, #888 0%, #d6d690 25%, #e8a040 50%, #c45032 75%, #6e2418 100%);
  }
  .legend-swatch.aspect-swatch {
    width: 28px;
    background: linear-gradient(90deg, #ff5c5c 0%, #ffd76b 33%, #5cd8ff 66%, #b67eff 100%);
  }
  .legend-swatch.snow-swatch {
    width: 28px;
    background: linear-gradient(to right, #ffffff 0%, #c5e3ff 30%, #80b4ff 60%, #1f4ec0 100%);
  }
  .legend-sub { font-family: var(--font-mono); color: var(--text-muted); font-size: 9.5px; margin-left: 4px; }
  .fed-popup-name { font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 2px; }
  .fed-popup-agency { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }

  .drop-overlay {
    position: absolute; inset: 0;
    background: rgba(255,107,53,0.08);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: 3px dashed var(--accent);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .drop-overlay.show { display: flex; }
  .drop-message {
    background: var(--bg-glass);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
    padding: 24px 32px;
    color: var(--accent);
    font-size: 18px;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
  }

  .toast-stack {
    position: absolute;
    top: 70px; left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--bg-glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    padding: 10px 14px;
    font-size: 13px;
    box-shadow: var(--shadow-md);
    animation: toast-in var(--t-med);
    max-width: 380px;
  }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--success); color: var(--success); }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  kbd {
    font-family: var(--font-mono);
    font-size: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--text-dim);
  }

  .track-popup-name { font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .track-popup-stats {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
    display: grid; grid-template-columns: auto auto; gap: 4px 12px;
  }
  .track-popup-stats .lbl { color: var(--text-muted); }

  .wpt-popup .wpt-name {
    font-weight: 600; font-size: 13px;
    color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .wpt-popup .wpt-sym { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .wpt-popup .wpt-desc { font-size: 11.5px; color: var(--text-dim); line-height: 1.45; margin: 4px 0 4px; white-space: pre-wrap; }
  .wpt-popup .wpt-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
  .wpt-popup .wpt-coords { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 4px; }
  .wpt-kind { font-size: 9.5px; padding: 1px 6px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; background: rgba(255,255,255,0.08); color: var(--text-dim); }
  .wpt-kind.kind-camp { background: rgba(255,107,53,0.2); color: #FF6B35; }
  .wpt-kind.kind-peak { background: rgba(74,158,255,0.2); color: #4A9EFF; }
  .wpt-kind.kind-water { background: rgba(61,201,245,0.2); color: #3DC9F5; }
  .wpt-kind.kind-trailhead { background: rgba(255,215,0,0.18); color: #FFD700; }
  .wpt-kind.kind-view { background: rgba(167,139,250,0.2); color: #A78BFA; }
  .wpt-kind.kind-food { background: rgba(245,166,35,0.2); color: #F5A623; }
  .wpt-kind.kind-hazard { background: rgba(255,59,48,0.2); color: #FF3B30; }

  .track-item.pinned { border-left: 2px solid var(--accent); }
  .track-pin { font-size: 10px; margin-right: 5px; opacity: 0.7; filter: hue-rotate(0deg); }
  .track-item.grouped .track-item-color { cursor: default; }
  .track-item.grouped .track-item-color:hover { width: 3px; }
  .track-group-tag { display: inline-block; margin-right: 5px; color: var(--accent); font-size: 11px; font-family: var(--font-mono); opacity: 0.8; }

  .feat-tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    display: none;
    max-width: 220px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .map-ctrl.active { background: var(--accent); color: #1a1d27; border-color: var(--accent); }
  body.pin-mode .maplibregl-canvas { cursor: crosshair !important; }
  body.pin-mode::after {
    content: 'Click on the map to drop a pin \B7 Esc to cancel';
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #1a1d27;
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
    padding: 8px 14px; border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    pointer-events: none; z-index: 50; letter-spacing: 0.02em;
  }

  body.measure-mode .maplibregl-canvas { cursor: crosshair !important; }
  body.measure-mode::after {
    content: 'Click to add points \B7 double-click to finish \B7 Esc to clear';
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #FFD93D; color: #1a1d27;
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
    padding: 8px 14px; border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    pointer-events: none; z-index: 50; letter-spacing: 0.02em;
  }
  .measure-readout {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    background: var(--bg-elevated); border: 1px solid #FFD93D;
    color: var(--text); font-family: var(--font-mono); font-size: 12px;
    padding: 7px 14px; border-radius: 18px; z-index: 7;
    display: none; align-items: center; gap: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .measure-readout.show { display: flex; }
  .measure-readout .m-label { color: #FFD93D; font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  .measure-readout .m-val { font-weight: 600; }
  .measure-readout .m-pts { color: var(--text-muted); font-size: 10.5px; }
  .measure-readout button {
    background: rgba(255,255,255,0.08); color: var(--text-dim); border: none;
    border-radius: 50%; width: 18px; height: 18px; cursor: pointer; font-size: 14px;
    line-height: 1; display: inline-flex; align-items: center; justify-content: center;
  }
  .measure-readout button:hover { background: var(--danger); color: #fff; }
  .pin-popup-name { font-weight: 600; font-size: 13px; color: #FFD93D; margin-bottom: 4px; }
  .pin-popup-coords { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); }
  .pin-popup-meta { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-muted); margin-top: 2px; }
  .pin-popup-delete {
    margin-top: 8px; background: rgba(255,59,48,0.15); color: #FF3B30;
    border: 1px solid rgba(255,59,48,0.3); border-radius: 4px; padding: 4px 10px;
    font-size: 11px; cursor: pointer; font-family: var(--font-mono); letter-spacing: 0.04em;
  }
  .pin-popup-delete:hover { background: rgba(255,59,48,0.25); border-color: rgba(255,59,48,0.5); }

  .hover-marker {
    width: 14px; height: 14px; background: var(--accent); border: 2px solid white;
    border-radius: 50%; box-shadow: 0 0 12px var(--accent-glow), 0 2px 6px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .weather-marker {
    width: 18px; height: 18px; background: var(--cold); border: 2px solid white;
    border-radius: 50%; box-shadow: 0 0 16px var(--cold-glow), 0 2px 8px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  @media (max-width: 720px) {
    :root { --sidebar-w: 100%; }
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    #sidebar {
      position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-height: 70vh;
      border-right: none; border-top: 1px solid var(--border);
      border-top-left-radius: 18px; border-top-right-radius: 18px;
      transform: translateY(calc(100% - 56px));
      transition: transform var(--t-med); z-index: 20;
    }
    #sidebar.open { transform: translateY(0); }
    .sidebar-header { cursor: pointer; position: relative; }
    .sidebar-header::before {
      content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px;
    }
    .sidebar-toggle { display: none; }
    .weather-panel { width: calc(100vw - 32px); right: 16px; top: 70px; }
    .map-controls { top: 122px; }
    .top-bar { right: 16px; }
    .elevation-panel { bottom: 60px; height: 160px; }
    .legend { left: 16px; bottom: 70px; }
    .scale-bar { bottom: 64px; }
    .north-arrow { display: none; }
  }

  #app.sidebar-collapsed #sidebar { pointer-events: none; }
</style>
</head>
<body>

<div id="app">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-header" id="sidebar-header">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div>ALEC'S</div>
          <div class="brand-meta">backcountry map</div>
        </div>
      </div>
    </div>
    <div class="sidebar-content">
      <div class="panel">
        <button class="load-gpx" id="btn-load-gpx">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Load GPX File
        </button>
        <input type="file" id="file-input" accept=".gpx" multiple style="display:none">
      </div>
      <div class="panel">
        <div class="panel-title">Tracks <span class="count" id="tracks-count">0</span></div>
        <div id="tracks-list">
          <div class="empty-state" id="tracks-empty">
            Drop GPX files here<br>or click <strong>Load GPX File</strong>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Public Lands</div>
        <div id="layers-list"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Terrain</div>
        <div id="terrain-list"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Basemap</div>
        <div class="basemap-row" id="basemap-row"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Shortcuts</div>
        <div style="font-size:11px;color:var(--text-dim);line-height:1.9;padding:0 8px">
          <div><kbd>3</kbd> toggle 3D terrain</div>
          <div><kbd>F</kbd> fullscreen</div>
          <div><kbd>/</kbd> focus search</div>
          <div><kbd>Esc</kbd> close panels</div>
          <div><kbd>right-click</kbd> weather here</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAP -->
  <main id="map-container">
    <div id="map"></div>

    <!-- Top bar -->
    <div class="map-overlay top-bar">
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar (Ctrl+B)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search a place, peak, or trailhead…" autocomplete="off" />
        <div class="search-results" id="search-results"></div>
      </div>
    </div>

    <!-- Map controls -->
    <div class="map-controls">
      <div class="map-ctrl-group">
        <button class="map-ctrl" id="btn-zoom-in" title="Zoom in">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="map-ctrl" id="btn-zoom-out" title="Zoom out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <button class="map-ctrl" id="btn-3d" title="Toggle 3D terrain (3)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20l5-9 4 6 3-4 6 7"/><path d="M3 20h18"/>
        </svg>
      </button>
      <button class="map-ctrl" id="btn-locate" title="Locate me">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
      </button>
      <button class="map-ctrl" id="btn-fullscreen" title="Fullscreen (F)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V3h4M21 7V3h-4M3 17v4h4M21 17v4h-4"/>
        </svg>
      </button>
      <button class="map-ctrl" id="btn-fit" title="Fit all tracks">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/>
        </svg>
      </button>
      <button class="map-ctrl" id="btn-pin" title="Drop a pin (P)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s-7-7.58-7-13a7 7 0 0 1 14 0c0 5.42-7 13-7 13z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
      </button>
      <button class="map-ctrl" id="btn-measure" title="Measure distance (M)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 16 16 2l6 6L8 22z"/>
          <path d="M7 10l1 1m1-3l1 1m1-3l1 1m1-3l1 1m1-3l1 1"/>
        </svg>
      </button>
    </div>

// ============================================================
// UTILS

const fmt = {
  dist(meters) { return (meters * 0.000621371).toFixed(1); },
  ele(meters)  { return Math.round(meters * 3.28084).toLocaleString(); },
  temp(c)      { return Math.round(c * 9/5 + 32); },
  wind(kmh)    { return Math.round(kmh * 0.621371); },
  snow(cm)     { return (cm * 0.393701).toFixed(1); },
  ll(n, d=4)   { return n.toFixed(d); },
};

function uid() { return Math.random().toString(36).slice(2, 10); }

function haversine(a, b) {
  const R = 6371000;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(b[1] - a[1]);
  const dLon = toRad(b[0] - a[0]);
  const lat1 = toRad(a[1]);
  const lat2 = toRad(b[1]);
  const x = Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon/2)**2;
  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function smoothArray(arr, window = 5) {
  const out = new Array(arr.length);
  const half = Math.floor(window / 2);
  for (let i = 0; i < arr.length; i++) {
    let sum = 0, n = 0;
    for (let j = Math.max(0, i - half); j <= Math.min(arr.length - 1, i + half); j++) {
      if (typeof arr[j] === 'number' && !isNaN(arr[j])) { sum += arr[j]; n++; }
    }
    out[i] = n ? sum / n : arr[i];
  }
  return out;
}

function calcStats(coords) {
  if (!coords || coords.length < 2) {
    return { distance: 0, gain: 0, loss: 0, maxEle: 0, minEle: 0, cumDist: [], smoothEle: [] };
  }
  const eles = coords.map(c => (c[2] != null ? c[2] : 0));
  const smoothEle = smoothArray(eles, 7);
  let distance = 0, gain = 0, loss = 0;
  let maxEle = -Infinity, minEle = Infinity;
  const cumDist = [0];
  const NOISE = 1.0;
  for (let i = 1; i < coords.length; i++) {
    distance += haversine(coords[i - 1], coords[i]);
    cumDist.push(distance);
    const dEle = smoothEle[i] - smoothEle[i - 1];
    if (dEle > NOISE) gain += dEle;
    else if (dEle < -NOISE) loss += -dEle;
    if (smoothEle[i] > maxEle) maxEle = smoothEle[i];
    if (smoothEle[i] < minEle) minEle = smoothEle[i];
  }
  return { distance, gain, loss, maxEle, minEle, cumDist, smoothEle };
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function nextTrackColor() {
  const c = CFG.trackColors[S.trackColorIdx % CFG.trackColors.length];

}

    el.style.opacity = '0';
    setTimeout(() => el.remove(), 200);
  }, ms);
}

  KEY_PINS: 'bcm.pins.v1',
  KEY_TRACK_STYLES: 'bcm.track-styles.v1',

  },
  loadPins() {

    catch (e) { return []; }
  },

  saveTracks() {
    try {
      const arr = [...S.tracks.values()].filter(t => !t.pinned).map(t => ({
        id: t.id, name: t.name, color: t.color,
        geojson: t.geojson,
        stats: { distance: t.stats.distance, gain: t.stats.gain, loss: t.stats.loss, maxEle: t.stats.maxEle, minEle: t.stats.minEle, wptCount: t.stats.wptCount, lineCount: t.stats.lineCount },
        source: t.source,
        visible: t.visible !== false,
        lineWidth: t.lineWidth,
        opacity: t.opacity,
      }));
      const json = JSON.stringify(arr);
      if (json.length < 4_000_000) localStorage.setItem(this.KEY_TRACKS, json);
      const overrides = {};
      for (const t of S.tracks.values()) {
        if (!t.pinned) continue;
        overrides[t.source] = { color: t.color, visible: t.visible !== false, lineWidth: t.lineWidth, opacity: t.opacity };
      }
      localStorage.setItem(this.KEY_TRACK_STYLES, JSON.stringify(overrides));
    } catch (e) { console.warn('Storage save failed', e); }
  },
  loadTracks() {
    try { const raw = localStorage.getItem(this.KEY_TRACKS); if (!raw) return []; return JSON.parse(raw); }
    catch (e) { return []; }
  },

// ============================================================
// MAP INIT
// ============================================================
function buildStyle(basemapKey) {
  const bm = CFG.basemaps[basemapKey];
  const style = {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {},
    layers: [],
  };
  if (bm.style) return bm.style;
  Object.assign(style.sources, bm.sources);
  style.layers = [...bm.layers];
  return style;
}

async function initMap() {
  let center = CFG.defaultCenter;
  let zoom = CFG.defaultZoom;
  let pitch = 0;
  let bearing = 0;
  const h = location.hash.slice(1).split('/');
  if (h.length >= 3) {
    const [la, ln, z, p, b] = h.map(parseFloat);
    if (!isNaN(la) && !isNaN(ln) && !isNaN(z)) {
      center = [ln, la]; zoom = z;
      if (!isNaN(p)) pitch = p;
      if (!isNaN(b)) bearing = b;
    }
  } else {
    const v = Store.loadSettings();
    if (v?.basemap && CFG.basemaps[v.basemap]) S.basemap = v.basemap;
  }

  S.map = new maplibregl.Map({
    container: 'map',
    style: buildStyle(S.basemap),
    center, zoom, pitch, bearing,
    attributionControl: { compact: true },
    hash: false,
    maxPitch: 75,
  });

  S.map.dragRotate.enable();
  S.map.touchZoomRotate.enableRotation();

  await new Promise(res => S.map.once('load', res));

  const saved = Store.loadSettings();
  if (saved) {
    if (saved.terrain) await setTerrain(true);
    if (saved.hillshade) await setHillshade(true);
    Object.entries(saved.layers || {}).forEach(([k, v]) => v && setLayer(k, true));
  }

  // RAF-throttled. MapLibre fires `move` many times per drag frame; we
  // coalesce DOM/style work into one update per animation frame.
  let moveRaf = 0;
  S.map.on('move', () => {
    if (moveRaf) return;
    moveRaf = requestAnimationFrame(() => {
      moveRaf = 0;
      const c = S.map.getCenter();
      $('#stat-zoom').textContent = S.map.getZoom().toFixed(2);
      rotateNorthArrow(S.map.getBearing());
      updateScaleBar();
      debouncedSaveHash(c.lat, c.lng, S.map.getZoom(), S.map.getPitch(), S.map.getBearing());
    });
  });

  S.map.on('mousemove', (e) => {
    $('#stat-lat').textContent = fmt.ll(e.lngLat.lat);
    $('#stat-lng').textContent = fmt.ll(e.lngLat.lng);
    if (S.terrain) {
      const ele = S.map.queryTerrainElevation(e.lngLat);
      $('#stat-ele').textContent = ele != null ? fmt.ele(ele) + ' ft' : '\u2014';
    } else {
      $('#stat-ele').textContent = '\u2014';
    }
  });

  S.map.on('contextmenu', (e) => {
    e.preventDefault();
    showWeatherAt(e.lngLat.lng, e.lngLat.lat);
  });

  const _layerErrSeen = new Map();
  S.map.on('error', (e) => {
    const sourceId = e.sourceId || (e.source && e.source.id) || '';
    if (!sourceId.startsWith('lands-')) return;
    const key = sourceId.replace('lands-', '');
    const cfg = CFG.layers[key];
    if (!cfg) return;
    const now = Date.now();
    const last = _layerErrSeen.get(sourceId) || 0;
    if (now - last < 8000) return;
    _layerErrSeen.set(sourceId, now);
    const reason = (e.error && e.error.message) || 'tile request failed';
    toast(`${cfg.label}: ${reason}`, 'error', 5000);
    console.warn(`[layer:${key}]`, e);
  });

  S.map.on('click', (e) => {
    if (S.measure.active) { addMeasurePoint(e.lngLat); return; }
    if (!S.pinMode) return;
    const hit = S.map.queryRenderedFeatures(e.point, { layers: [PIN_LAYER] });
    if (hit.length) return;
    dropPin(e.lngLat);
    setPinMode(false);
  });

  S.map.on('dblclick', (e) => {
    if (S.measure.active) { e.preventDefault?.(); setMeasureMode(false); }
  });

  let touchTimer = null;
  let touchStart = null;
  const cancelLongPress = () => { if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; } };
  S.map.on('touchstart', (e) => {
    if (e.points && e.points.length === 1) {
      const p = e.points[0];
      touchStart = { x: p.x, y: p.y };
      const ll = e.lngLat;
      touchTimer = setTimeout(() => {
        if (navigator.vibrate) navigator.vibrate(40);
        showWeatherAt(ll.lng, ll.lat);
      }, 600);
    }
  });
  S.map.on('touchmove', (e) => {
    if (!touchStart || !e.points || !e.points.length) return;
    const p = e.points[0];
    if (Math.hypot(p.x - touchStart.x, p.y - touchStart.y) > 10) cancelLongPress();
  });
  S.map.on('touchend', cancelLongPress);
  S.map.on('touchcancel', cancelLongPress);

  updateScaleBar();
}

const debouncedSaveHash = debounce((lat, lng, zoom, pitch, bearing) => {
  const parts = [lat.toFixed(4), lng.toFixed(4), zoom.toFixed(2)];
  if (pitch > 0.5) parts.push(pitch.toFixed(0));
  if (Math.abs(bearing) > 0.5) parts.push(bearing.toFixed(0));
  history.replaceState(null, '', '#' + parts.join('/'));
}, 400);

function rotateNorthArrow(bearing) {
  $('#north-arrow').style.transform = `rotate(${-bearing}deg)`;
}

function updateScaleBar() {
  const c = S.map.getCenter();
  const z = S.map.getZoom();
  const mPerPx = 156543.03392 * Math.cos(c.lat * Math.PI / 180) / Math.pow(2, z);
  const targetPx = 80;
  let metres = mPerPx * targetPx;
  const miles = metres * 0.000621371;
  const niceMiles = [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 25, 50, 100, 250, 500];
  let nice = niceMiles[0];
  for (const v of niceMiles) if (v <= miles) nice = v;
  const niceMetres = nice / 0.000621371;
  const px = Math.round(niceMetres / mPerPx);
  $('#scale-line').style.width = px + 'px';
  $('#scale-text').textContent = nice < 1 ? `${(nice*5280).toFixed(0)} ft` : `${nice} mi`;
}

// ============================================================
// BASEMAP SWITCHING
// ============================================================
async function setBasemap(key) {
  if (S.basemap === key) return;
  S.basemap = key;
  $$('#basemap-row .basemap-btn').forEach(b => b.classList.toggle('active', b.dataset.bm === key));

  const wasTerrain = S.terrain;
  const wasHillshade = S.hillshade;
  const wasLayers = { ...S.layers };
  const trackList = [...S.tracks.values()];

  S.map.setStyle(buildStyle(key));
  await new Promise(res => S.map.once('styledata', res));

  unregisterFederalLandsMoveEnd();
  _flLastKey.clear();
  _flBoundClicks.clear();

  if (wasTerrain) await setTerrain(true, true);
  if (wasHillshade) await setHillshade(true, true);
  for (const k of Object.keys(wasLayers)) if (wasLayers[k]) setLayer(k, true, true);
  for (const t of trackList) renderTrackOnMap(t);
  ensurePinLayers();
  refreshPinLayer();
  ensureMeasureLayers();
  refreshMeasureLayer();

  Store.saveSettings();
}

function buildBasemapUI() {
  const row = $('#basemap-row');
  row.innerHTML = '';
  for (const [k, v] of Object.entries(CFG.basemaps)) {
    const btn = document.createElement('button');
    btn.className = 'basemap-btn' + (S.basemap === k ? ' active' : '');
    btn.dataset.bm = k;
    btn.textContent = v.label;
    btn.onclick = () => setBasemap(k);
    row.appendChild(btn);
  }
}
